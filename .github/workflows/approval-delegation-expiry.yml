name: approval-delegation-expiry

on:
  workflow_dispatch:
    inputs:
      organization_ids:
        description: "Optional comma-separated organization IDs"
        required: false
        type: string
      expires_before_at:
        description: "Optional cutoff ISO datetime (defaults to now)"
        required: false
        type: string
      dry_run:
        description: "Run in dry-run mode (no mutation)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: approval-delegation-expiry
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate required production secrets
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.FLOWHR_PRODUCTION_DATABASE_URL }}
          PRODUCTION_DIRECT_URL: ${{ secrets.FLOWHR_PRODUCTION_DIRECT_URL }}
        run: |
          missing=()
          for key in PRODUCTION_DATABASE_URL PRODUCTION_DIRECT_URL; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required production secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run approval delegation expiry sweep
        env:
          DATABASE_URL: ${{ secrets.FLOWHR_PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.FLOWHR_PRODUCTION_DIRECT_URL }}
          FLOWHR_DATA_ACCESS: prisma
          FLOWHR_APPROVAL_DELEGATION_EXPIRY_ORGANIZATION_IDS: ${{ inputs.organization_ids }}
          FLOWHR_APPROVAL_DELEGATION_EXPIRY_EFFECTIVE_AT: ${{ inputs.expires_before_at }}
          FLOWHR_APPROVAL_DELEGATION_EXPIRY_DRY_RUN: ${{ inputs.dry_run }}
        run: npm run ops:approval:delegations:expire --if-present

      - name: Upsert issue on failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[approval-delegation-expiry] failed run ${context.runNumber}`;
            const body = [
              "Approval delegation expiry sweep workflow failed.",
              "",
              `- Run: ${runUrl}`,
              `- Ref: ${context.ref}`,
              `- Trigger: ${context.eventName}`
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "incident,approval,ops",
              per_page: 100
            });
            const incident = existing.data.find((issue) =>
              issue.title.startsWith("[approval-delegation-expiry] failed run")
            );
            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["incident", "approval", "ops"]
              });
            }

      - name: Notify alert webhook on failure
        if: ${{ failure() }}
        env:
          FLOWHR_ALERT_DISCORD_WEBHOOK: ${{ secrets.FLOWHR_ALERT_DISCORD_WEBHOOK }}
          FLOWHR_ALERT_SLACK_WEBHOOK: ${{ secrets.FLOWHR_ALERT_SLACK_WEBHOOK }}
          FLOWHR_ALERT_TITLE: "[FlowHR] approval-delegation-expiry 실패"
          FLOWHR_ALERT_WORKFLOW: "approval-delegation-expiry"
          FLOWHR_ALERT_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FLOWHR_ALERT_REF: ${{ github.ref }}
          FLOWHR_ALERT_TRIGGER: ${{ github.event_name }}
          FLOWHR_ALERT_RUNBOOK_URL: "https://github.com/${{ github.repository }}/blob/main/docs/production-rollout.md"
          FLOWHR_ALERT_BREAK_GLASS_URL: "https://github.com/${{ github.repository }}/blob/main/docs/break-glass.md"
        run: node scripts/ops/notify-slack-failure.mjs

      - name: Close open expiry incidents on success
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "incident,approval,ops",
              per_page: 100
            });

            for (const issue of openIssues.data) {
              if (!issue.title.startsWith("[approval-delegation-expiry] failed run")) {
                continue;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  "approval-delegation-expiry workflow succeeded and auto-closes this incident.",
                  "",
                  `- Success Run: ${runUrl}`,
                  `- Ref: ${context.ref}`,
                  `- Trigger: ${context.eventName}`
                ].join("\n")
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }
