name: vercel-production-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-vercel-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Vercel config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || '' }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'flowhr' }}
        run: |
          missing=()
          if [ -z "$VERCEL_TOKEN" ]; then
            missing+=("VERCEL_TOKEN")
          fi
          if [ -z "$VERCEL_PROJECT_NAME" ]; then
            missing+=("VERCEL_PROJECT_NAME")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required Vercel secret/vars: ${missing[*]}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required production database secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          missing=()
          for key in DATABASE_URL DIRECT_URL; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required production database secrets: ${missing[*]}"
            exit 1
          fi

      - name: Validate production migration database URL format
        env:
          RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAW_DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          normalize_url() {
            local value="$1"
            value="${value#DATABASE_URL=}"
            value="${value#DIRECT_URL=}"
            value="${value#\"}"
            value="${value%\"}"
            value="$(echo -n "$value" | tr -d '\r' | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//')"
            echo "$value"
          }

          require_session_pooler() {
            local name="$1"
            local value="$2"
            if [[ ! "$value" =~ ^postgres(ql)?:// ]]; then
              echo "::error::$name must start with postgres:// or postgresql://"
              exit 1
            fi
            if [[ ! "$value" =~ :5432([/?]|$) ]]; then
              echo "::error::$name must use the session pooler on port 5432."
              exit 1
            fi
            if [[ "$value" != *"pgbouncer=false"* ]]; then
              echo "::error::$name must include pgbouncer=false for Prisma migrate deploy."
              exit 1
            fi
          }

          NORMALIZED_DATABASE_URL="$(normalize_url "$RAW_DATABASE_URL")"
          NORMALIZED_DIRECT_URL="$(normalize_url "$RAW_DIRECT_URL")"

          require_session_pooler "DATABASE_URL" "$NORMALIZED_DATABASE_URL"
          require_session_pooler "DIRECT_URL" "$NORMALIZED_DIRECT_URL"

          echo "FLOWHR_MIGRATION_DATABASE_URL=$NORMALIZED_DATABASE_URL" >> "$GITHUB_ENV"
          echo "FLOWHR_MIGRATION_DIRECT_URL=$NORMALIZED_DIRECT_URL" >> "$GITHUB_ENV"

      - name: Install dependencies for Prisma migration
        run: npm ci

      - name: Run Prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.FLOWHR_MIGRATION_DATABASE_URL }}
          DIRECT_URL: ${{ env.FLOWHR_MIGRATION_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Deploy production on Vercel (scope-candidate fallback)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || '' }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'flowhr' }}
        run: |
          scope_candidates=("__UNSCOPED__")
          if [ -n "$VERCEL_SCOPE" ]; then
            scope_candidates+=("$VERCEL_SCOPE")
          fi
          if [ -n "$GITHUB_REPOSITORY_OWNER" ]; then
            scope_candidates+=("$GITHUB_REPOSITORY_OWNER")
          fi

          unique_scopes=()
          for scope in "${scope_candidates[@]}"; do
            duplicate=false
            for seen_scope in "${unique_scopes[@]}"; do
              if [ "$seen_scope" = "$scope" ]; then
                duplicate=true
                break
              fi
            done
            if [ "$duplicate" = false ]; then
              unique_scopes+=("$scope")
            fi
          done

          if [ ${#unique_scopes[@]} -eq 0 ]; then
            echo "::error::No Vercel context candidate is available."
            exit 1
          fi

          echo "Trying Vercel deployment contexts in order: ${unique_scopes[*]}"

          run_vercel() {
            local command="$1"
            shift
            local access_error_only=true

            for scope in "${unique_scopes[@]}"; do
              local output
              local context_label="$scope"
              if [ "$scope" = "__UNSCOPED__" ]; then
                context_label="unscoped"
                if output="$(npx vercel@latest "$command" "$@" --token "$VERCEL_TOKEN" 2>&1)"; then
                  echo "$output"
                  echo "vercel $command succeeded with context '$context_label'"
                  return 0
                fi
              else
                if output="$(npx vercel@latest "$command" "$@" --scope "$scope" --token "$VERCEL_TOKEN" 2>&1)"; then
                  echo "$output"
                  echo "vercel $command succeeded with context '$context_label'"
                  return 0
                fi
              fi

              echo "$output"
              if echo "$output" | grep -qiE "scope-not-accessible|do not have access to the specified account"; then
                echo "::warning::Vercel $command failed with access error for context '$context_label'."
              else
                access_error_only=false
                echo "::warning::Vercel $command failed for context '$context_label'."
              fi
            done

            if [ "$access_error_only" = true ]; then
              echo "::error::All vercel $command attempts failed with context-access errors. Tried contexts: ${unique_scopes[*]}"
            else
              echo "::error::All vercel $command attempts failed. Tried contexts: ${unique_scopes[*]}"
            fi
            return 1
          }

          if ! npx vercel@latest whoami --token "$VERCEL_TOKEN"; then
            echo "::error::Failed to authenticate Vercel token. Verify VERCEL_TOKEN in production environment secrets."
            exit 1
          fi

          run_vercel link --yes --project "$VERCEL_PROJECT_NAME"
          run_vercel pull --yes --environment=production
          run_vercel deploy --prod --yes
