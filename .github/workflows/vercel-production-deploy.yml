name: vercel-production-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-vercel-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Vercel config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || '' }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'flowhr' }}
        run: |
          missing=()
          if [ -z "$VERCEL_TOKEN" ]; then
            missing+=("VERCEL_TOKEN")
          fi
          if [ -z "$VERCEL_PROJECT_NAME" ]; then
            missing+=("VERCEL_PROJECT_NAME")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required Vercel secret/vars: ${missing[*]}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy production on Vercel (scope fallback)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || '' }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'flowhr' }}
        run: |
          run_vercel() {
            local command="$1"
            shift

            if [ -n "$VERCEL_SCOPE" ]; then
              if npx vercel@latest "$command" "$@" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"; then
                return 0
              fi
              echo "::warning::Scoped vercel $command failed for '$VERCEL_SCOPE'; retrying without --scope."
            fi

            npx vercel@latest "$command" "$@" --token "$VERCEL_TOKEN"
          }

          run_vercel link --yes --project "$VERCEL_PROJECT_NAME"
          run_vercel pull --yes --environment=production
          run_vercel deploy --prod --yes
