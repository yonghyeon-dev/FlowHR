name: vercel-production-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-vercel-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Vercel config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || '' }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'flowhr' }}
        run: |
          missing=()
          if [ -z "$VERCEL_TOKEN" ]; then
            missing+=("VERCEL_TOKEN")
          fi
          if [ -z "$VERCEL_PROJECT_NAME" ]; then
            missing+=("VERCEL_PROJECT_NAME")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required Vercel secret/vars: ${missing[*]}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy production on Vercel (scope-candidate fallback)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || '' }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'flowhr' }}
        run: |
          scope_candidates=()
          if [ -n "$VERCEL_SCOPE" ]; then
            scope_candidates+=("$VERCEL_SCOPE")
          fi
          if [ -n "$GITHUB_REPOSITORY_OWNER" ]; then
            scope_candidates+=("$GITHUB_REPOSITORY_OWNER")
          fi

          unique_scopes=()
          for scope in "${scope_candidates[@]}"; do
            duplicate=false
            for seen_scope in "${unique_scopes[@]}"; do
              if [ "$seen_scope" = "$scope" ]; then
                duplicate=true
                break
              fi
            done
            if [ "$duplicate" = false ]; then
              unique_scopes+=("$scope")
            fi
          done

          if [ ${#unique_scopes[@]} -eq 0 ]; then
            echo "::error::No Vercel scope candidate is available. Configure VERCEL_SCOPE."
            exit 1
          fi

          run_vercel() {
            local command="$1"
            shift

            for scope in "${unique_scopes[@]}"; do
              if npx vercel@latest "$command" "$@" --scope "$scope" --token "$VERCEL_TOKEN"; then
                echo "vercel $command succeeded with scope '$scope'"
                return 0
              fi
              echo "::warning::Scoped vercel $command failed for '$scope'."
            done

            echo "::error::All scoped vercel $command attempts failed. Tried scopes: ${unique_scopes[*]}"
            return 1
          }

          run_vercel link --yes --project "$VERCEL_PROJECT_NAME"
          run_vercel pull --yes --environment=production
          run_vercel deploy --prod --yes
