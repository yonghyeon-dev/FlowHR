owner: scheduling-agent
version: 0.24.0
scope:
  in:
    - work schedule assignment (planned start/end)
    - schedule list query by period
    - schedule template creation/list
    - template-based single-date schedule assignment
    - template-based multi-day range assignment
    - rotation sequence assignment with multiple templates
    - rotation balance report (weekday load and planned-minute imbalance, read-only)
    - rotation optimization endpoint (start-offset evaluation and optional write-back apply)
    - rotation fairness report endpoint (tenant-scoped multi-employee optimization summary, read-only)
    - rotation fairness write-back endpoint (tenant-scoped multi-employee apply orchestration)
    - global fairness constraints for multi-employee offset coordination (daily planned-minute gap objective)
    - advanced multi-objective fairness optimization (employee preference and labor-law penalty weighting)
    - schedule-to-attendance anomaly report (late/no-show, non-blocking)
    - tenant-level anomaly cockpit dashboard read-model (severity/queue summary)
    - tenant-level anomaly cockpit bounded streaming snapshots (SSE)
    - tenant-level anomaly cockpit stream incident automation event (SSE) with severity/cooldown policy
    - anomaly incident lifecycle command API (acknowledge/assign/resolve) with audit/event traceability
    - anomaly incident read-model API (list/detail with timeline projection)
    - anomaly incident SLA monitoring API (read-only prioritized SLA status view)
    - anomaly incident escalation automation command API (SLA-based workflow request publisher with cooldown)
    - anomaly incident auto-action execution command API (escalation + lifecycle assign orchestration with ops notification event)
    - anomaly alert automation event emission behind feature flag
    - anomaly escalation event emission (severity/owner/retry metadata) behind feature flag
    - anomaly cockpit ticket request automation event emission behind feature flag
    - tenant-scoped schedule access (RLS baseline + service scoping)
  out:
    - rotation balancing/optimization engine
    - GPS/QR/geofence clock-in enforcement
    - anomaly-driven automatic payroll or approval enforcement
    - multi-channel escalation policy orchestration
    - legally binding payroll enforcement from fairness recommendations
entities:
  - name: WorkSchedule
    description: Planned work schedule entry for an employee.
  - name: WorkScheduleTemplate
    description: Organization-scoped schedule template with weekday and minute-based shift window.
  - name: AttendanceRecord
    description: Actual attendance record used as read-only signal input for anomaly detection.
api:
  auth:
    - role: employee
      permission: view own schedules and own anomaly report only
    - role: manager
      permission: assign/update/delete schedules, manage templates, assign/optimize/fairness-report/fairness-apply rotations, and list employee-scoped anomaly reports within tenant
    - role: admin
      permission: assign/update/delete schedules, manage templates, assign rotation, and list anomalies within tenant/platform scope
  endpoints:
    - method: GET
      path: /scheduling/schedules
      description: List schedules filtered by period (from/to) and optional employeeId.
    - method: POST
      path: /scheduling/schedules
      description: Create a schedule entry for an employee.
    - method: PATCH
      path: /scheduling/schedules/{scheduleId}
      description: Update a schedule entry (time/break/holiday/notes); overlap rules apply.
    - method: DELETE
      path: /scheduling/schedules/{scheduleId}
      description: Delete an existing schedule entry.
    - method: GET
      path: /scheduling/templates
      description: List organization schedule templates.
    - method: POST
      path: /scheduling/templates
      description: Create organization schedule template.
    - method: POST
      path: /scheduling/templates/{templateId}/assign
      description: Assign template to one employee for one date and create WorkSchedule.
    - method: POST
      path: /scheduling/templates/{templateId}/assign-range
      description: Assign template to one employee for every matching weekday in date range.
    - method: POST
      path: /scheduling/rotations/assign
      description: Assign schedules by rotating templates over matched weekdays in date range.
    - method: GET
      path: /scheduling/rotations/balance
      description: Read-only rotation balance report by period with optional employee filter.
    - method: POST
      path: /scheduling/rotations/optimize
      description: Evaluate optimized template order and optionally apply rotation assignment write-back.
    - method: POST
      path: /scheduling/rotations/fairness
      description: Read-only tenant-level fairness report aggregating per-employee recommendations with optional global and advanced multi-objective constraints.
    - method: POST
      path: /scheduling/rotations/fairness/apply
      description: Apply tenant-level fairness recommendations with optional global threshold guard and advanced multi-objective constraints before schedule writes.
    - method: GET
      path: /scheduling/anomalies
      description: Read-only anomaly report by period with optional employee filter.
    - method: GET
      path: /scheduling/anomalies/cockpit
      description: Read-only tenant-level anomaly cockpit summary with severity distribution and prioritized queue.
    - method: GET
      path: /scheduling/anomalies/cockpit/stream
      description: Read-only tenant-level anomaly cockpit SSE stream with bounded snapshots, optional incident-automation events, and stream-end marker.
    - method: POST
      path: /scheduling/anomalies/incidents/{incidentId}/ack
      description: Acknowledge anomaly incident for operator triage and append audit/event traceability.
    - method: POST
      path: /scheduling/anomalies/incidents/{incidentId}/assign
      description: Assign anomaly incident owner for operator handling and append audit/event traceability.
    - method: POST
      path: /scheduling/anomalies/incidents/{incidentId}/resolve
      description: Resolve anomaly incident with resolution code and append audit/event traceability.
    - method: GET
      path: /scheduling/anomalies/incidents
      description: List anomaly incident read-model entries with optional state/assignee filters and bounded topN.
    - method: GET
      path: /scheduling/anomalies/incidents/sla
      description: Read anomaly incident SLA dashboard with status buckets (healthy/warning/breached/resolved) and prioritized queue.
    - method: POST
      path: /scheduling/anomalies/incidents/escalate
      description: Trigger anomaly incident escalation workflow requests from SLA candidate set with cooldown control.
    - method: POST
      path: /scheduling/anomalies/incidents/auto-actions
      description: Execute anomaly incident auto-actions by orchestrating escalation candidate selection and lifecycle assignment with optional dry-run.
    - method: GET
      path: /scheduling/anomalies/incidents/{incidentId}
      description: Read one anomaly incident read-model entry including command history timeline.
  events:
    published:
      - name: scheduling.schedule.assigned.v1
        description: Emitted when a schedule entry is created/assigned for an employee.
      - name: scheduling.schedule.updated.v1
        description: Emitted when an existing schedule entry is updated.
      - name: scheduling.schedule.deleted.v1
        description: Emitted when an existing schedule entry is deleted.
      - name: scheduling.template.created.v1
        description: Emitted when a schedule template is created.
      - name: scheduling.template.assigned.v1
        description: Emitted when a schedule is created from a template assignment.
      - name: scheduling.template.range_assigned.v1
        description: Emitted when range assignment creates one or more schedules.
      - name: scheduling.rotation.assigned.v1
        description: Emitted when rotation assignment creates one or more schedules.
      - name: scheduling.anomaly.detected.v1
        description: Emitted when anomaly alert automation is enabled and anomalies are detected.
      - name: scheduling.anomaly.escalated.v1
        description: Emitted when anomaly escalation automation is enabled and anomalies are detected.
      - name: scheduling.anomaly.ticket.requested.v1
        description: Emitted when anomaly cockpit ticket automation is enabled and queue entries match severity policy.
      - name: scheduling.anomaly.incident.updated.v1
        description: Emitted when anomaly incident lifecycle command (ack/assign/resolve) is executed.
      - name: scheduling.anomaly.incident.escalation.requested.v1
        description: Emitted when anomaly incident escalation command requests workflow escalation for one incident.
      - name: scheduling.anomaly.incident.auto_action.executed.v1
        description: Emitted when anomaly incident auto-action command executes escalation-driven assignment workflow and publishes ops notification summary.
    consumed: []
db_changes:
  migrations:
    - id: 202602150003_scheduling_baseline
      description: Create WorkSchedule table (Employee FK) and enable RLS tenant isolation policies.
    - id: 202602160001_scheduling_template_recurring
      description: Create WorkScheduleTemplate table and enable tenant RLS policies.
  backward_compatible: true
  notes: Additive API/report behavior only; no schema changes after template baseline.
invariants:
  - WorkSchedule.employeeId must reference existing Employee.id (FK enforced).
  - startAt must be strictly before endAt.
  - WorkSchedule time windows must not overlap for the same employee (back-to-back is allowed).
  - Employee schedule list queries are restricted to own employeeId.
  - WorkScheduleTemplate.startMinute/endMinute must be in range 0..1439 and cannot be equal.
  - WorkScheduleTemplate.weekdays must contain values in range 1..7.
  - Template assignment is allowed only when requested date weekday is in template.weekdays.
  - Range assignment creates schedules only for weekdays included in template.weekdays.
  - Range assignment overlap validation is preflighted and must fail with no writes on conflict.
  - Rotation assignment requires at least two unique template ids.
  - Rotation assignment requires all templates share identical weekday set.
  - Rotation assignment overlap validation is preflighted and must fail with no writes on conflict.
  - Rotation optimization evaluates all start offsets against existing schedule load and returns one deterministic recommendation.
  - Rotation optimization with apply=true must reuse rotation assignment invariants and overlap guards.
  - Rotation fairness report must remain read-only and must not write WorkSchedule state.
  - Rotation fairness report must be tenant-scoped and reject cross-tenant organization queries.
  - Rotation fairness report with global constraints must deterministically coordinate employee offsets for the configured objective.
  - Rotation fairness report with advanced constraints must deterministically apply employee preference and labor-law penalty scoring for identical input.
  - Advanced preference constraints must reference employee ids and template ids within the fairness request scope.
  - Rotation fairness apply must preflight overlap checks for all target employees before writing schedules.
  - Rotation fairness apply must reuse rotation assignment invariants and emit assignment events per employee.
  - Rotation fairness apply must fail with 409 and no writes when configured global threshold is breached.
  - Rotation balance report is read-only and must not update WorkSchedule state.
  - Anomaly report is read-only and must not update WorkSchedule or AttendanceRecord state.
  - Anomaly cockpit report is read-only and must not update WorkSchedule or AttendanceRecord state.
  - Anomaly cockpit stream is read-only and must not update WorkSchedule or AttendanceRecord state.
  - Anomaly cockpit report requires scheduling write-any permission and tenant scope.
  - Anomaly cockpit stream requires scheduling write-any permission and tenant scope.
  - Anomaly cockpit stream must suppress ticket automation side-effects to avoid duplicate ticket requests per snapshot.
  - Anomaly cockpit stream incident automation event is emitted only when `incidentAutomation=true` and queue severity matches threshold.
  - Anomaly cockpit stream incident automation event must respect `incidentCooldownSeconds` to rate-limit repeated automation triggers.
  - Anomaly cockpit stream incident automation event is operational signal only and must not emit domain events or mutate scheduling/attendance state.
  - Anomaly incident lifecycle command API requires scheduling write-any permission and tenant scope.
  - Anomaly incident ASSIGN command requires non-empty `assigneeId`.
  - Anomaly incident RESOLVE command persists standardized `resolutionCode` (default `OTHER`) in audit/event payload.
  - Anomaly incident lifecycle commands are operational trace signals and must not mutate scheduling/attendance/payroll state.
  - Anomaly incident read-model list/detail APIs require scheduling write-any permission and tenant scope.
  - Anomaly incident read-model list/detail projection source must be persisted audit lifecycle events (durable across process restart).
  - Anomaly incident SLA API requires scheduling write-any permission and tenant scope.
  - Anomaly incident SLA status must be derived from read-model `updatedAt` versus SLA policy (`slaTargetMinutes`, `warningMinutes`) without mutating incident state.
  - Anomaly incident SLA policy must satisfy `0 <= warningMinutes < slaTargetMinutes`.
  - Anomaly incident escalation command API requires scheduling write-any permission and tenant scope.
  - Anomaly incident escalation command publishes workflow request event only for SLA candidate incidents and must not mutate scheduling/attendance/payroll state.
  - Anomaly incident escalation command must suppress duplicate workflow requests for same incident within cooldown window.
  - Anomaly incident escalation command `dryRun=true` must not publish domain events or per-incident request audit entries.
  - Anomaly incident auto-action command API requires scheduling write-any permission and tenant scope.
  - Anomaly incident auto-action command must only assign incident owner metadata and must not mutate scheduling/attendance/payroll state.
  - Anomaly incident auto-action command `dryRun=true` must not execute lifecycle assign writes or publish auto-action notification domain events.
  - Anomaly incident read-model detail API must return 404 for cross-tenant incidentId requests (no existence leak).
  - Late anomaly is raised only when check-in is strictly after schedule start plus threshold minutes.
  - Anomaly alert automation must not block anomaly report API response.
  - Anomaly escalation automation must not block anomaly report API response.
  - Anomaly cockpit ticket automation must not block anomaly cockpit API response.
  - Anomaly cockpit ticket automation emits requests only for queue entries at or above configured severity threshold.
risk:
  permissions:
    - Unauthorized schedule/template/rotation/anomaly access can leak employee working patterns across tenants.
  payroll_accuracy:
    - Schedule and anomaly report are informational only for MVP and do not affect payroll calculation.
    - Anomaly cockpit stream side-effects must not alter schedule/attendance/payroll state transitions.
    - Alert automation side-effects must not alter schedule/attendance/payroll state transitions.
    - Escalation automation side-effects must not alter schedule/attendance/payroll state transitions.
    - Ticket request automation side-effects must not alter schedule/attendance/payroll state transitions.
    - Incident auto-action side-effects must not alter schedule/attendance/payroll state transitions.
  legal:
    - Schedule/template/anomaly report access should remain auditable.
test_plan:
  unit:
    - schedule/template payload validation boundaries
    - range assignment date-window validation and weekday generation boundaries
    - anomaly threshold and overlap classification boundaries
  integration:
    - manager can create schedule; employee cannot
    - manager can update schedule; employee cannot
    - manager can delete schedule; employee cannot
    - manager can create/list template and assign template; employee cannot
    - manager can assign template across date range in single request
    - range assignment conflict returns 409 with no partial writes
    - manager can assign rotation using multiple templates across date range
    - rotation assignment rejects mixed weekday sets and conflict causes no partial writes
    - rotation balance report enforces role boundaries (manager employeeId-required; employee own-only)
    - rotation balance report returns grade and weekday load aggregates without mutating schedules
    - rotation optimization dry-run returns recommended start offset and does not mutate schedules
    - rotation optimization apply=true creates schedules using optimized template order
    - rotation fairness report returns aggregated tenant-level metrics and per-employee recommendations without mutating schedules
    - rotation fairness report with global constraints returns global summary and diversified offset recommendations
    - rotation fairness report with advanced constraints returns per-employee advanced penalty score and advanced summary
    - rotation fairness advanced constraints reject out-of-scope template ids and employee ids
    - rotation fairness report rejects unknown employee ids in organization scope
    - rotation fairness apply creates schedules for all selected employees and returns per-employee created schedule ids
    - rotation fairness apply rejects with 409 when global maxDailyPlannedMinutesGap is unsatisfied
    - rotation fairness apply returns advanced summary when advanced constraints are configured
    - rotation fairness apply enforces role boundaries (employee denied)
    - list schedules enforces role boundaries (employee own-only; manager requires employeeId)
    - anomaly report enforces role boundaries (manager employeeId-required; employee own-only)
    - anomaly cockpit report returns tenant-level severity summary and prioritized queue for manager/admin roles
    - anomaly cockpit report enforces role boundaries (employee denied)
    - anomaly report with alert flag emits anomaly event/audit when anomalies exist
    - anomaly report with escalation flag emits escalation event/audit with severity/owner/retry metadata
    - anomaly cockpit report with ticket automation flag emits ticket request event/audit when severity policy matches
    - anomaly cockpit report with ticket automation disabled does not emit ticket request event
    - anomaly cockpit stream returns bounded SSE snapshots and appends stream-opened audit
    - anomaly cockpit stream suppresses ticket request domain event even when ticket automation is enabled
    - anomaly cockpit stream emits incident-automation SSE event when enabled and severity/cooldown policy matches
    - anomaly incident ack/assign/resolve APIs append audit logs and emit incident lifecycle domain event
    - anomaly incident list/detail APIs return lifecycle read-model timeline for authorized operators
    - anomaly incident SLA API returns deterministic status counts/priority ordering for identical query and asOf
    - anomaly incident escalation command publishes workflow events for SLA candidates and respects cooldown skip behavior
    - anomaly incident auto-action command assigns incident owner only for escalated candidates and publishes notification summary event
  regression:
    - template assignment path reuses schedule overlap guard
    - single-date assignment behavior remains unchanged
    - anomaly report does not mutate schedule or attendance states
    - anomaly cockpit report does not mutate schedule or attendance states
    - anomaly report remains available even when alert publication fails
    - anomaly report remains available even when escalation publication fails
    - anomaly cockpit report remains available even when ticket automation publication or config validation fails
    - anomaly cockpit stream remains available and bounded by sampleCount/interval query constraints
    - anomaly cockpit stream incident automation cooldown remains deterministic for identical snapshot sequence timing
    - anomaly incident lifecycle commands do not mutate scheduling or attendance records
    - anomaly incident read-model APIs do not mutate scheduling or attendance records
    - anomaly incident SLA API remains read-only and does not mutate scheduling or attendance records
    - anomaly incident escalation command remains operational-only and does not mutate scheduling or attendance records
    - anomaly incident auto-action command remains operational-only and does not mutate scheduling or attendance records
    - rotation balance report does not mutate schedules
    - rotation optimization dry-run does not mutate schedules
    - rotation fairness report does not mutate schedules
    - rotation fairness global constraints path remains deterministic for identical inputs
    - rotation fairness advanced constraints path remains deterministic for identical inputs
    - rotation fairness apply emits rotation assignment event/audit for each applied employee
  authorization:
    - permission boundaries for create/update/delete/list/template-assign/template-range-assign/rotation-assign/rotation-optimize/rotation-fairness/rotation-fairness-apply/anomaly-report
    - permission boundaries for anomaly-cockpit and anomaly-cockpit-stream read endpoints
    - permission boundaries for anomaly incident lifecycle command endpoints (ack/assign/resolve)
    - permission boundaries for anomaly incident read-model list/detail endpoints
    - permission boundaries for anomaly incident SLA endpoint
    - permission boundaries for anomaly incident escalation command endpoint
    - permission boundaries for anomaly incident auto-action command endpoint
  payroll_accuracy:
    - anomaly report is non-blocking and does not change payroll run outputs
