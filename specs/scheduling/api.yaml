openapi: 3.1.0
info:
  title: FlowHR Scheduling API
  version: 0.6.0
paths:
  /scheduling/schedules:
    get:
      summary: List schedules
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Schedules listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
    post:
      summary: Create schedule
      responses:
        "201":
          description: Created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "409":
          description: Overlapping schedule exists
  /scheduling/schedules/{scheduleId}:
    patch:
      summary: Update schedule
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Schedule not found
        "409":
          description: Overlapping schedule exists
    delete:
      summary: Delete schedule
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Schedule not found
  /scheduling/templates:
    get:
      summary: List schedule templates
      responses:
        "200":
          description: Templates listed
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
    post:
      summary: Create schedule template
      responses:
        "201":
          description: Created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/templates/{templateId}/assign:
    post:
      summary: Assign template to employee for one date
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Schedule created from template
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template not found
        "409":
          description: Template weekday mismatch or overlapping schedule exists
  /scheduling/templates/{templateId}/assign-range:
    post:
      summary: Assign template to employee over date range (matching weekdays only)
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Schedules created from template range assignment
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template or employee not found in tenant scope
        "409":
          description: One or more generated windows overlap existing schedules
  /scheduling/anomalies:
    get:
      summary: List schedule-to-attendance anomalies (read-only)
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
        - in: query
          name: lateThresholdMinutes
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Anomaly report listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Employee not found in tenant scope
