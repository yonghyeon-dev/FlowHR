openapi: 3.1.0
info:
  title: FlowHR Scheduling API
  version: 0.15.0
paths:
  /scheduling/schedules:
    get:
      summary: List schedules
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Schedules listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
    post:
      summary: Create schedule
      responses:
        "201":
          description: Created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "409":
          description: Overlapping schedule exists
  /scheduling/schedules/{scheduleId}:
    patch:
      summary: Update schedule
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Schedule not found
        "409":
          description: Overlapping schedule exists
    delete:
      summary: Delete schedule
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Schedule not found
  /scheduling/templates:
    get:
      summary: List schedule templates
      responses:
        "200":
          description: Templates listed
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
    post:
      summary: Create schedule template
      responses:
        "201":
          description: Created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/templates/{templateId}/assign:
    post:
      summary: Assign template to employee for one date
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Schedule created from template
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template not found
        "409":
          description: Template weekday mismatch or overlapping schedule exists
  /scheduling/templates/{templateId}/assign-range:
    post:
      summary: Assign template to employee over date range (matching weekdays only)
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Schedules created from template range assignment
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template or employee not found in tenant scope
        "409":
          description: One or more generated windows overlap existing schedules
  /scheduling/rotations/assign:
    post:
      summary: Assign rotation by template sequence over date range
      responses:
        "201":
          description: Rotation schedules created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template or employee not found in tenant scope
        "409":
          description: Template weekday mismatch or overlapping schedule exists
  /scheduling/rotations/balance:
    get:
      summary: Rotation balance report by period (read-only)
      description: Analyze weekday schedule counts and planned minutes to provide rotation balancing grade and recommendations.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Rotation balance report listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Employee not found in tenant scope
  /scheduling/rotations/optimize:
    post:
      summary: Optimize rotation template order and optionally apply assignment
      description: Evaluate rotation start offsets to minimize weekday/planned-minute imbalance, then optionally write schedules using optimized order.
      responses:
        "201":
          description: Optimization result returned (and schedules created when apply=true)
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template or employee not found in tenant scope
        "409":
          description: Template weekday mismatch, organization mismatch, or overlap conflict when apply=true
  /scheduling/rotations/fairness:
    post:
      summary: Generate tenant-level rotation fairness report across employees (read-only)
      description: Evaluate per-employee recommendations and optionally coordinate offsets with global daily planned-minute gap constraints.
      responses:
        "200":
          description: Fairness report generated
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions or cross-tenant fairness query
        "404":
          description: Template or employee not found in tenant/organization scope
        "409":
          description: Template weekday mismatch or organization mismatch between template and employee
  /scheduling/rotations/fairness/apply:
    post:
      summary: Apply tenant-level fairness recommendations to schedule rotations
      description: Generate fairness recommendations (optionally with global constraints) and write schedules per employee when threshold guards are satisfied.
      responses:
        "201":
          description: Fairness recommendations applied and schedules created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions or cross-tenant apply query
        "404":
          description: Template or employee not found in tenant/organization scope
        "409":
          description: Template weekday mismatch, organization mismatch, overlap conflict, or global fairness threshold breach
  /scheduling/anomalies:
    get:
      summary: List schedule-to-attendance anomalies (read-only)
      description: When anomaly automation flags are enabled, anomaly detection can emit `scheduling.anomaly.detected.v1` and `scheduling.anomaly.escalated.v1` without changing response shape.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
        - in: query
          name: lateThresholdMinutes
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Anomaly report listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Employee not found in tenant scope
  /scheduling/anomalies/cockpit:
    get:
      summary: List tenant-level anomaly cockpit summary (read-only)
      description: Aggregate anomaly severity and prioritized queue for operator triage within tenant scope.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: lateThresholdMinutes
          required: false
          schema:
            type: integer
        - in: query
          name: topN
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Anomaly cockpit summary listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
