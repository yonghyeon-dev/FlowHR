openapi: 3.1.0
info:
  title: FlowHR Scheduling API
  version: 0.22.0
paths:
  /scheduling/schedules:
    get:
      summary: List schedules
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Schedules listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
    post:
      summary: Create schedule
      responses:
        "201":
          description: Created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "409":
          description: Overlapping schedule exists
  /scheduling/schedules/{scheduleId}:
    patch:
      summary: Update schedule
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Schedule not found
        "409":
          description: Overlapping schedule exists
    delete:
      summary: Delete schedule
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Schedule not found
  /scheduling/templates:
    get:
      summary: List schedule templates
      responses:
        "200":
          description: Templates listed
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
    post:
      summary: Create schedule template
      responses:
        "201":
          description: Created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/templates/{templateId}/assign:
    post:
      summary: Assign template to employee for one date
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Schedule created from template
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template not found
        "409":
          description: Template weekday mismatch or overlapping schedule exists
  /scheduling/templates/{templateId}/assign-range:
    post:
      summary: Assign template to employee over date range (matching weekdays only)
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Schedules created from template range assignment
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template or employee not found in tenant scope
        "409":
          description: One or more generated windows overlap existing schedules
  /scheduling/rotations/assign:
    post:
      summary: Assign rotation by template sequence over date range
      responses:
        "201":
          description: Rotation schedules created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template or employee not found in tenant scope
        "409":
          description: Template weekday mismatch or overlapping schedule exists
  /scheduling/rotations/balance:
    get:
      summary: Rotation balance report by period (read-only)
      description: Analyze weekday schedule counts and planned minutes to provide rotation balancing grade and recommendations.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Rotation balance report listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Employee not found in tenant scope
  /scheduling/rotations/optimize:
    post:
      summary: Optimize rotation template order and optionally apply assignment
      description: Evaluate rotation start offsets to minimize weekday/planned-minute imbalance, then optionally write schedules using optimized order.
      responses:
        "201":
          description: Optimization result returned (and schedules created when apply=true)
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Template or employee not found in tenant scope
        "409":
          description: Template weekday mismatch, organization mismatch, or overlap conflict when apply=true
  /scheduling/rotations/fairness:
    post:
      summary: Generate tenant-level rotation fairness report across employees (read-only)
      description: Evaluate per-employee recommendations and optionally coordinate offsets with global daily planned-minute gap constraints plus advanced preference/labor-law weighting.
      responses:
        "200":
          description: Fairness report generated
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions or cross-tenant fairness query
        "404":
          description: Template or employee not found in tenant/organization scope
        "409":
          description: Template weekday mismatch or organization mismatch between template and employee
  /scheduling/rotations/fairness/apply:
    post:
      summary: Apply tenant-level fairness recommendations to schedule rotations
      description: Generate fairness recommendations (optionally with global constraints and advanced preference/labor-law weighting) and write schedules per employee when threshold guards are satisfied.
      responses:
        "201":
          description: Fairness recommendations applied and schedules created
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions or cross-tenant apply query
        "404":
          description: Template or employee not found in tenant/organization scope
        "409":
          description: Template weekday mismatch, organization mismatch, overlap conflict, or global fairness threshold breach
  /scheduling/anomalies:
    get:
      summary: List schedule-to-attendance anomalies (read-only)
      description: When anomaly automation flags are enabled, anomaly detection can emit `scheduling.anomaly.detected.v1` and `scheduling.anomaly.escalated.v1` without changing response shape.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
        - in: query
          name: lateThresholdMinutes
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Anomaly report listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Employee not found in tenant scope
  /scheduling/anomalies/cockpit:
    get:
      summary: List tenant-level anomaly cockpit summary (read-only)
      description: Aggregate anomaly severity and prioritized queue for operator triage within tenant scope. When ticket automation flag is enabled, cockpit queries may emit `scheduling.anomaly.ticket.requested.v1`.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: lateThresholdMinutes
          required: false
          schema:
            type: integer
        - in: query
          name: topN
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Anomaly cockpit summary listed
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/anomalies/cockpit/stream:
    get:
      summary: Stream tenant-level anomaly cockpit snapshots (SSE, read-only)
      description: Emits `cockpit-snapshot` SSE events, optional `incident-automation` SSE events (severity/cooldown policy), and a final `stream-end` event for bounded real-time dashboard updates within tenant scope.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
        - in: query
          name: lateThresholdMinutes
          required: false
          schema:
            type: integer
        - in: query
          name: topN
          required: false
          schema:
            type: integer
        - in: query
          name: intervalSeconds
          required: false
          schema:
            type: integer
        - in: query
          name: sampleCount
          required: false
          schema:
            type: integer
        - in: query
          name: incidentAutomation
          required: false
          schema:
            type: boolean
        - in: query
          name: incidentSeverity
          required: false
          schema:
            type: string
            enum:
              - MINOR
              - MAJOR
              - CRITICAL
        - in: query
          name: incidentCooldownSeconds
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: SSE stream opened
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/anomalies/incidents/{incidentId}/ack:
    post:
      summary: Acknowledge anomaly incident
      description: Operational incident lifecycle command for anomaly triage acknowledgement (audit/event traceability only).
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Incident lifecycle updated
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/anomalies/incidents/{incidentId}/assign:
    post:
      summary: Assign anomaly incident owner
      description: Operational incident lifecycle command for owner assignment (audit/event traceability only).
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Incident lifecycle updated
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/anomalies/incidents/{incidentId}/resolve:
    post:
      summary: Resolve anomaly incident
      description: Operational incident lifecycle command for resolution close-out with resolution code (audit/event traceability only).
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Incident lifecycle updated
        "400":
          description: Invalid payload
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/anomalies/incidents:
    get:
      summary: List anomaly incident read-model entries
      description: Read incident lifecycle projection entries for operator dashboards with optional state/assignee filters.
      parameters:
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum:
              - ACKNOWLEDGED
              - ASSIGNED
              - RESOLVED
        - in: query
          name: assigneeId
          required: false
          schema:
            type: string
        - in: query
          name: topN
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Incident read-model list returned
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/anomalies/incidents/sla:
    get:
      summary: List anomaly incident SLA monitoring entries
      description: Read incident SLA status dashboard with prioritized queue and policy summary for operator triage.
      parameters:
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum:
              - ACKNOWLEDGED
              - ASSIGNED
              - RESOLVED
        - in: query
          name: assigneeId
          required: false
          schema:
            type: string
        - in: query
          name: topN
          required: false
          schema:
            type: integer
        - in: query
          name: includeResolved
          required: false
          schema:
            type: boolean
        - in: query
          name: slaTargetMinutes
          required: false
          schema:
            type: integer
        - in: query
          name: warningMinutes
          required: false
          schema:
            type: integer
        - in: query
          name: asOf
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Incident SLA monitoring payload returned
        "400":
          description: Invalid query
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
  /scheduling/anomalies/incidents/{incidentId}:
    get:
      summary: Read one anomaly incident read-model entry
      description: Return incident lifecycle state and timeline history for one incident id.
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Incident read-model detail returned
        "400":
          description: Invalid incident id
        "401":
          description: Missing/invalid actor context
        "403":
          description: Insufficient permissions
        "404":
          description: Incident not found in tenant scope
