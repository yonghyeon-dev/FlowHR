owner: leave-agent
version: 1.9.0
scope:
  in:
    - leave request create/update/cancel flow
    - leave request fractional units (full-day/half-day/hourly)
    - leave request list query by period overlap
    - leave approve/reject flow with audit trace
    - leave balance read model contract
    - annual leave accrual and carry-over settlement
    - leave policy read/update (annual grant + carry-over cap + fractional controls + notice/consecutive constraints)
    - annual leave promotion preview and internal notice draft policy
    - annual leave promotion notice dispatch automation via webhook (Discord/Slack) and email-template channel
  out:
    - external calendar synchronization
entities:
  - name: LeaveRequest
    description: Employee leave request with period, type, unit, and status.
  - name: LeaveApproval
    description: Approval or rejection decision record with actor and reason.
  - name: LeaveBalanceProjection
    description: Read model of granted, used, remaining, and carry-over leave days (decimal precision).
  - name: LeavePolicy
    description: Organization-level leave policy (annual grant, carry-over cap, fractional controls, request constraints, and annual leave promotion controls).
api:
  auth:
    - role: employee
      permission: create/update and list own leave requests
    - role: manager
      permission: approve/reject leave requests and read leave policy within tenant scope
    - role: payroll_operator
      permission: settle leave accrual cycle, read leave balances, manage leave policy, and list leave requests for payroll review
    - role: admin
      permission: full leave operations
  endpoints:
    - method: GET
      path: /leave/requests
      description: List leave requests overlapping a period (from/to) with optional employeeId/state filters.
    - method: POST
      path: /leave/requests
      description: Create leave request with optional unit/hours fields.
    - method: PATCH
      path: /leave/requests/{requestId}
      description: Update pending leave request with optional unit/hours fields.
    - method: POST
      path: /leave/requests/{requestId}/approve
      description: Approve leave request.
    - method: POST
      path: /leave/requests/{requestId}/reject
      description: Reject leave request with reason.
    - method: POST
      path: /leave/requests/{requestId}/cancel
      description: Cancel pending leave request.
    - method: GET
      path: /leave/balances/{employeeId}
      description: Retrieve leave balance snapshot.
    - method: GET
      path: /leave/policy
      description: Read leave policy for an organization (defaults when not configured).
    - method: PUT
      path: /leave/policy
      description: Upsert leave policy for an organization including fractional controls and request constraints.
    - method: GET
      path: /leave/policy/promotion-preview
      description: Preview annual leave promotion targets and internal announcement draft based on policy.
    - method: POST
      path: /leave/policy/promotion-notify
      description: Dispatch annual leave promotion notice through webhook or email-template channel (supports dry-run).
    - method: POST
      path: /leave/accrual/settle
      description: Settle annual leave accrual and carry-over for an employee.
  events:
    published:
      - name: leave.requested.v1
        description: Emitted when leave request is created.
      - name: leave.approved.v1
        description: Emitted when leave request is approved.
      - name: leave.rejected.v1
        description: Emitted when leave request is rejected.
      - name: leave.canceled.v1
        description: Emitted when pending leave is canceled.
      - name: leave.accrual.settled.v1
        description: Emitted when annual accrual settlement is applied.
      - name: leave.policy.updated.v1
        description: Emitted when leave policy is created or updated.
      - name: leave.promotion.notice.dispatched.v1
        description: Emitted when annual leave promotion notice is dispatched through the configured delivery channel.
    consumed:
      - name: employee.profile.updated.v1
        description: Employee org/profile metadata updates.
db_changes:
  migrations:
    - id: 202602140001_wi0002_leave_base
      description: Create leave requests, approvals, and balance projection tables.
    - id: 202602140002_wi0003_leave_accrual
      description: Add carry-over and accrual settlement trace fields to LeaveBalanceProjection.
    - id: 202602140006_employee_fk_constraints
      description: Backfill Employee rows and enforce employeeId FK constraints for core tables.
    - id: 202602180002_leave_policy
      description: Add organization-level leave policy (annual grant + carry-over cap).
    - id: 202602180005_leave_fractional_units
      description: Add leave unit/hours fields, widen leave balance to decimals, and extend leave policy fractional controls.
    - id: 202602190003_leave_policy_notice_consecutive
      description: Add leave policy constraints for minimum advance notice and max consecutive leave days.
    - id: 202602190007_leave_policy_annual_promotion
      description: Add annual leave promotion controls and internal notice template fields to LeavePolicy.
  backward_compatible: true
  notes: Additive schema changes with numeric widening (`Int -> Decimal(6,2)`) for leave day precision.
invariants:
  - Final leave decisions are immutable and auditable.
  - Employee can mutate only own pending request.
  - Approved leave state is consumable for attendance/payroll downstream.
  - Same employee/year accrual settlement cannot be applied more than once.
  - Carry-over days are capped by policy and never negative.
  - Leave accrual settlement uses leave policy defaults when grant/cap inputs are omitted.
  - Employee leave list queries are restricted to own employeeId.
  - LeaveRequest.employeeId and LeaveBalanceProjection.employeeId must reference existing Employee.id (FK enforced).
  - Hourly leave requests must satisfy policy increment and maximum-hour rules.
  - Leave requests must satisfy policy minNoticeDays and maxConsecutiveDays constraints when configured.
  - LeaveBalanceProjection values keep two-decimal precision and never go negative.
  - Annual leave promotion targets are filtered by remainingDays threshold and organization scope.
  - Annual leave promotion preview can include upcoming targets before notice window opens, but immediate targets require notice window open.
  - Annual leave promotion notice dispatch requires leave accrual settle permission and tenant scope validation.
  - Annual leave promotion notice dry-run never triggers external delivery side effects.
  - Email-template channel dispatch requires template id resolution and configured endpoint/from address.
risk:
  permissions:
    - Unauthorized approval or accrual settlement can alter payroll and staffing plans.
  payroll_accuracy:
    - Paid leave misclassification or incorrect carry-over cap can distort gross-pay totals.
  legal:
    - Leave decision history must be retained for dispute/audit handling.
test_plan:
  unit:
    - leave state transition guard validation
    - leave date normalization by Asia/Seoul
    - accrual settlement carry-over cap calculation
    - leave policy validation and default fallback
    - leave fractional unit calculation (FULL_DAY/HALF_DAY/HOUR)
    - hourly increment and maxHoursPerRequest validation
    - minNoticeDays/maxConsecutiveDays validation
    - annual leave promotion preview window and placeholder rendering
    - leave list query parsing and role boundary guards
  integration:
    - create leave request rejects unknown employeeId (404)
    - create/update/approve leave flow
    - reject flow with reason and audit
    - accrual settlement with duplicate-year protection
    - leave policy upsert/read returns configured values
    - accrual settlement uses policy defaults when request does not include grant/cap
    - list leave requests by period overlap returns expected rows
    - employee cross-employee list query is blocked with 403
    - manager list query requires employeeId (400)
    - half-day and hourly leave approval updates balance with decimal day usage
    - policy-denied half-day/hourly requests return 409
    - policy-denied requests for minNoticeDays/maxConsecutiveDays return 409
    - annual leave promotion preview returns threshold-filtered targets and rendered announcement draft
    - annual leave promotion notify dispatch triggers webhook when `deliveryChannel=webhook` and eligible targets exist
    - annual leave promotion notify dispatch triggers email-template endpoint when `deliveryChannel=email_template` and recipients with email exist
    - annual leave promotion notify dry-run and no-target/no-recipient run never call external delivery endpoints
  regression:
    - overlap detection and boundary-date regressions
    - leave balance continuity after yearly settlement
    - whole-day leave flow remains backward compatible after fractional-unit rollout
    - maxConsecutiveDays null update restores unlimited consecutive requests
    - annual leave promotion disabled mode returns no targets regardless of balance state
    - annual leave promotion notify returns 503 when dispatch is required but selected channel configuration is missing
  authorization:
    - employee self-service boundary check
    - manager/admin approval check
    - payroll_operator/admin-only accrual settlement check
    - employee self-only list boundary check
  payroll_accuracy:
    - approved paid leave classification for payroll consumer compatibility
    - carry-over cap and yearly reset rules
    - decimal day usage (`hours/8`) consistency for payroll consumers
observability:
  audit_events:
    - leave.requested
    - leave.approved
    - leave.rejected
    - leave.canceled
    - leave.accrual_settled
    - leave.policy_read
    - leave.policy_updated
    - leave.promotion_preview_read
    - leave.promotion_notice.dispatched
    - leave.promotion_notice.dry_run
    - leave.promotion_notice.skipped
    - leave.promotion_notice.failed
  metrics:
    - leave_approval_latency_ms
    - leave_request_rejection_rate
    - leave_accrual_settlement_count
    - leave_hourly_request_count
    - leave_halfday_request_count
    - leave_policy_denied_count
    - leave_promotion_target_count
    - leave_promotion_notice_dispatched_count
  logs:
    - leave authorization denied with actor role
    - leave accrual duplicate-year rejection logs
rollout:
  feature_flags:
    - name: leave_request_v1
      default: "off"
    - name: leave_approval_v1
      default: "off"
    - name: leave_accrual_v1
      default: "off"
  migration_strategy: expand-contract
rollback:
  strategy: disable leave flags and route accrual settlement to manual operations
  max_recovery_time: 30m
deprecations: []
breaking_changes: false
consumer_impact: "Contract v1.9.0 extends annual leave promotion notice dispatch endpoint (`POST /leave/policy/promotion-notify`) with `deliveryChannel=email_template` and template delivery telemetry while preserving existing webhook behavior."
references:
  - specs/common/time-and-payroll-rules.md
  - work-items/WI-0035-employeeid-fk-migration.md
  - work-items/WI-0027-leave-list-api.md
  - work-items/WI-0090-leave-policy-settings.md
  - work-items/WI-0104-leave-fractional-hourly-policy.md
  - work-items/WI-0114-leave-notice-consecutive-policy.md
  - work-items/WI-0120-leave-promotion-notice-preview.md
  - work-items/WI-0122-leave-promotion-notice-delivery-automation.md
  - work-items/WI-0124-leave-promotion-email-template-delivery.md
approval:
  spec_owner: leave-agent
  qa_owner: qa-agent
