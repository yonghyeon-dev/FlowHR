owner: people-agent
version: 0.3.1
scope:
  in:
    - organization master data (create/read/list)
    - employee master data (create/read/list/update)
    - department master data (create/read/list/update)
    - position master data (create/read/list/update)
    - employee profile assignment with department/position consistency checks
    - audit logs for all employee/org mutations
    - domain events for employee/org mutations
    - notice workspace persistence read-model tables for organization-scoped employee communication
  out:
    - multi-tenant enforcement (RLS) across core tables (Phase 1 follow-up)
    - RBAC engine and permission administration UI (Phase 1 follow-up)
    - attendance/leave/payroll business rules
entities:
  - name: Organization
    description: Company/tenant placeholder entity used for future tenant isolation.
  - name: Department
    description: Organization-level department catalog with unique code per organization.
  - name: Position
    description: Organization-level position catalog with unique code per organization.
  - name: Employee
    description: HR master entity. Canonical id should match Supabase auth user.id (UUID string) for production.
api:
  auth:
    - role: admin
      permission: manage employees and organizations
  endpoints:
    - method: GET
      path: /people/organizations
      description: List organizations.
    - method: POST
      path: /people/organizations
      description: Create organization.
    - method: GET
      path: /people/organizations/{organizationId}
      description: Get organization by id.
    - method: GET
      path: /people/employees
      description: List employees (optional filters).
    - method: GET
      path: /people/departments
      description: List departments (optional active/organization filters).
    - method: POST
      path: /people/departments
      description: Create department with unique code per organization.
    - method: GET
      path: /people/departments/{departmentId}
      description: Get department by id.
    - method: PATCH
      path: /people/departments/{departmentId}
      description: Update department metadata.
    - method: GET
      path: /people/positions
      description: List positions (optional active/organization filters).
    - method: POST
      path: /people/positions
      description: Create position with unique code per organization.
    - method: GET
      path: /people/positions/{positionId}
      description: Get position by id.
    - method: PATCH
      path: /people/positions/{positionId}
      description: Update position metadata.
    - method: POST
      path: /people/employees
      description: Create employee (id must be provided; recommended Supabase user.id) with optional departmentId/positionId assignment.
    - method: GET
      path: /people/employees/{employeeId}
      description: Get employee by id.
    - method: GET
      path: /people/employees/{employeeId}/history
      description: List employee profile history events (created/profile-updated).
    - method: PATCH
      path: /people/employees/{employeeId}
      description: Update employee profile fields (admin only).
  events:
    published:
      - name: organization.created.v1
        description: Emitted when an organization record is created.
      - name: department.created.v1
        description: Emitted when a department record is created.
      - name: department.updated.v1
        description: Emitted when department metadata is updated.
      - name: position.created.v1
        description: Emitted when a position record is created.
      - name: position.updated.v1
        description: Emitted when position metadata is updated.
      - name: employee.created.v1
        description: Emitted when an employee record is created.
      - name: employee.profile.updated.v1
        description: Emitted when employee profile metadata is updated (name/email/org/active).
    consumed: []
db_changes:
  migrations:
    - id: 202602140005_employee_master
      description: Create Organization and Employee base tables.
    - id: 202602180003_people_department_position
      description: Add Department/Position tables and employee departmentId/positionId references.
    - id: 202603020001_wi0755_notices_db_read_model
      description: Add Notice, NoticeReadReceipt, and NoticeNotificationQueue models for notices persistence/read-model.
  backward_compatible: true
  notes: "Additive foundation tables only. Department/Position are organization-scoped catalogs."
invariants:
  - Employee mutations are admin-only in v0.1.
  - Employee id is treated as canonical identifier and should match Supabase auth user.id in production.
  - Organization is a placeholder for future tenant isolation (no RLS enforced by this contract).
  - Department code must be unique within an organization.
  - Position code must be unique within an organization.
  - Employee department and position assignments must match employee organization scope.
risk:
  permissions:
    - Unauthorized employee creation could lead to data integrity issues once FK enforcement is introduced.
    - Unauthorized department/position updates may impact workforce reporting and approval routing.
  legal:
    - Employee PII must be minimized and audited.
test_plan:
  unit:
    - create/update payload validation boundaries (email, name length)
    - department/position payload and query validation boundaries
    - list query filter parsing
  integration:
    - organization create/list/get admin-only
    - employee create/list/get/update admin-only
    - employee history list (created/profile-updated) returns most recent entries first
    - department/position create/list/get/update admin-only
    - employee org mismatch with department/position returns 409
    - duplicate employee create returns 409
    - duplicate department/position code in same organization returns 409
  regression:
    - existing attendance/leave/payroll flows remain unchanged
  authorization:
    - non-admin calls are rejected with 403
  payroll_accuracy:
    - not applicable
observability:
  audit_events:
    - organization.created
    - department.created
    - department.updated
    - position.created
    - position.updated
    - employee.created
    - employee.profile.updated
  metrics:
    - employee_created_count
    - employee_updated_count
    - department_created_count
    - position_created_count
  logs:
    - authorization denied logs for people endpoints
rollout:
  feature_flags:
    - name: people_v1
      default: "off"
  migration_strategy: expand-contract
rollback:
  strategy: disable people_v1 and revert API exposure; data remains for forward-fix
  max_recovery_time: 30m
deprecations: []
breaking_changes: false
consumer_impact: "People contract v0.3.1 adds notice read-model persistence tables as additive DB change. Existing Organization/Employee/Department/Position APIs remain backward compatible."
references:
  - work-items/WI-0034-employee-organization-master-model.md
  - work-items/WI-0102-people-department-position-model.md
  - work-items/WI-0755-notices-db-persistence-and-notification-read-model.md
  - docs/data-ownership.md
approval:
  spec_owner: people-agent
  qa_owner: qa-agent

