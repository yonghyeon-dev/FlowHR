openapi: 3.1.0
info:
  title: FlowHR People API
  version: 0.3.19
paths:
  /admin/notification-defaults:
    get:
      summary: Get organization notification defaults
      responses:
        "200":
          description: Notification defaults returned
        "403":
          description: Admin role required
    put:
      summary: Update organization notification defaults
      responses:
        "200":
          description: Notification defaults updated
        "400":
          description: Invalid payload
        "403":
          description: Admin role required
  /people/organizations:
    get:
      summary: List organizations
      responses:
        "200":
          description: Organizations listed
    post:
      summary: Create organization
      responses:
        "201":
          description: Created
  /people/organizations/{organizationId}:
    get:
      summary: Get organization
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization returned
        "404":
          description: Not found
  /admin/organization/settings:
    get:
      summary: Get current admin organization settings
      responses:
        "200":
          description: Organization settings returned
        "403":
          description: Admin role required
    patch:
      summary: Update current admin organization settings
      responses:
        "200":
          description: Organization settings updated
        "400":
          description: Invalid payload
        "403":
          description: Admin role required
  /people/employees:
    get:
      summary: List employees
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - ON_LEAVE
              - RESIGNED
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Employees listed
    post:
      summary: Create employee with optional department/position assignment
      responses:
        "201":
          description: Created
        "409":
          description: Duplicate
  /employees:
    get:
      summary: List employees (alias endpoint)
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - ON_LEAVE
              - RESIGNED
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Employees listed
  /employees/{id}/status:
    patch:
      summary: Transition employee status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee status transitioned
        "400":
          description: Invalid transition or payload
        "403":
          description: Admin role required
        "404":
          description: Employee not found
  /people/departments:
    get:
      summary: List departments
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Departments listed
    post:
      summary: Create department
      responses:
        "201":
          description: Created
        "409":
          description: Duplicate code in organization
  /people/departments/{departmentId}:
    get:
      summary: Get department
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Department returned
        "404":
          description: Not found
    patch:
      summary: Update department
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
    delete:
      summary: Delete department
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "400":
          description: Department has assigned employees
        "404":
          description: Not found
  /people/positions:
    get:
      summary: List positions
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Positions listed
    post:
      summary: Create position with title/grade/description support
      responses:
        "201":
          description: Created
        "409":
          description: Duplicate code in organization
  /people/positions/{positionId}:
    get:
      summary: Get position
      parameters:
        - in: path
          name: positionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Position returned
        "404":
          description: Not found
    patch:
      summary: Update position
      parameters:
        - in: path
          name: positionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
    delete:
      summary: Delete position
      parameters:
        - in: path
          name: positionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "400":
          description: Position has assigned employees
        "404":
          description: Not found
  /people/employees/{employeeId}:
    get:
      summary: Get employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee returned
        "404":
          description: Not found
    patch:
      summary: Update employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
  /people/employees/{employeeId}/history:
    get:
      summary: List employee profile history
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: History listed
        "404":
          description: Employee not found
  /recruitment/referrals:
    get:
      summary: List recruitment referrals
      parameters:
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              - updated_desc
              - stalled_priority
      responses:
        "200":
          description: Referrals listed
    post:
      summary: Create recruitment referral
      responses:
        "201":
          description: Created
        "409":
          description: Opening closed or duplicate active referral
  /benefits/catalog:
    get:
      summary: List benefits catalog
      responses:
        "200":
          description: Catalog listed
    post:
      summary: Create benefits catalog item
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden
  /notices/{noticeId}:
    patch:
      summary: Partially update a draft or scheduled notice
      parameters:
        - in: path
          name: noticeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notice updated
        "400":
          description: Invalid payload or empty patch body
        "403":
          description: Admin or manager role required
        "404":
          description: Notice not found
        "409":
          description: Published notices are locked from edits
  /benefits/catalog/{benefitId}/status:
    post:
      summary: Update benefits catalog status
      parameters:
        - in: path
          name: benefitId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "409":
          description: Pending submitted requests block deactivation
        "403":
          description: Forbidden
        "404":
          description: Not found
  /benefits/requests:
    get:
      summary: List benefits requests
      parameters:
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              - updated_desc
              - pending_priority
      responses:
        "200":
          description: Requests listed
    post:
      summary: Create benefits request
      responses:
        "201":
          description: Created
        "409":
          description: Inactive catalog or organization mismatch
  /benefits/requests/{requestId}/decision:
    post:
      summary: Decide benefits request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request updated
        "409":
          description: Invalid request state
  /benefits/requests/{requestId}/cancel:
    post:
      summary: Cancel benefits request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request canceled
        "409":
          description: Invalid request state
  /employee/notification-preferences:
    get:
      summary: Get employee notification preferences resolved against organization defaults
      responses:
        "200":
          description: Notification preferences returned
        "401":
          description: Unauthorized
        "403":
          description: Employee role required
    put:
      summary: Save or reset employee notification preferences
      responses:
        "200":
          description: Notification preferences updated
        "400":
          description: Invalid payload
        "401":
          description: Unauthorized
        "403":
          description: Employee role required

