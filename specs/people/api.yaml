openapi: 3.1.0
info:
  title: FlowHR People API
  version: 0.2.0
paths:
  /people/organizations:
    get:
      summary: List organizations
      responses:
        "200":
          description: Organizations listed
    post:
      summary: Create organization
      responses:
        "201":
          description: Created
  /people/organizations/{organizationId}:
    get:
      summary: Get organization
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization returned
        "404":
          description: Not found
  /people/employees:
    get:
      summary: List employees
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Employees listed
    post:
      summary: Create employee with optional department/position assignment
      responses:
        "201":
          description: Created
        "409":
          description: Duplicate
  /people/departments:
    get:
      summary: List departments
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Departments listed
    post:
      summary: Create department
      responses:
        "201":
          description: Created
        "409":
          description: Duplicate code in organization
  /people/departments/{departmentId}:
    get:
      summary: Get department
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Department returned
        "404":
          description: Not found
    patch:
      summary: Update department
      parameters:
        - in: path
          name: departmentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
  /people/positions:
    get:
      summary: List positions
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Positions listed
    post:
      summary: Create position
      responses:
        "201":
          description: Created
        "409":
          description: Duplicate code in organization
  /people/positions/{positionId}:
    get:
      summary: Get position
      parameters:
        - in: path
          name: positionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Position returned
        "404":
          description: Not found
    patch:
      summary: Update position
      parameters:
        - in: path
          name: positionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
  /people/employees/{employeeId}:
    get:
      summary: Get employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee returned
        "404":
          description: Not found
    patch:
      summary: Update employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Not found

