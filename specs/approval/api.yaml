openapi: 3.1.0
info:
  title: FlowHR Approval Policy API
  version: 0.8.0
paths:
  /approval/policy:
    get:
      summary: Read approval policy
      parameters:
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Approval policy returned (configured or default fallback)
        "403":
          description: Permission denied
    put:
      summary: Upsert approval policy
      responses:
        "200":
          description: Approval policy saved
        "400":
          description: Invalid payload
        "403":
          description: Permission denied
  /approval/policy/gate-preview:
    post:
      summary: Preview approval gate result without state mutation
      description: Simulates policy/template/delegation evaluation for given domain and actor context. Matched template payload includes `approvalStages`.
      responses:
        "200":
          description: Gate preview result
        "400":
          description: Invalid payload
        "403":
          description: Permission denied
  /approval/stage-history:
    get:
      summary: List persisted approval stage-history evaluations
      parameters:
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
        - in: query
          name: domain
          required: false
          schema:
            type: string
            enum: [ATTENDANCE, LEAVE, PAYROLL]
        - in: query
          name: targetEntityType
          required: false
          schema:
            type: string
        - in: query
          name: targetEntityId
          required: false
          schema:
            type: string
        - in: query
          name: allowed
          required: false
          schema:
            type: boolean
        - in: query
          name: resolution
          required: false
          schema:
            type: string
            enum: [EXPECTED_ROLE, ACTIVE_DELEGATION, PRIVILEGED_BYPASS, DENIED]
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Stage-history rows listed
        "400":
          description: Invalid query
        "403":
          description: Permission denied
  /approval/executions:
    get:
      summary: List runtime approval executions
      parameters:
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
        - in: query
          name: domain
          required: false
          schema:
            type: string
            enum: [ATTENDANCE, LEAVE, PAYROLL]
        - in: query
          name: targetEntityType
          required: false
          schema:
            type: string
        - in: query
          name: targetEntityId
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Approval execution rows listed
        "400":
          description: Invalid query
        "403":
          description: Permission denied
  /approval/delegations:
    get:
      summary: List approval delegations
      parameters:
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
        - in: query
          name: domain
          required: false
          schema:
            type: string
            enum: [ATTENDANCE, LEAVE, PAYROLL]
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: delegateActorId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Delegations listed
        "403":
          description: Permission denied
    post:
      summary: Create approval delegation
      responses:
        "201":
          description: Delegation created
        "400":
          description: Invalid payload
        "403":
          description: Permission denied
  /approval/delegations/{delegationId}:
    patch:
      summary: Update approval delegation
      parameters:
        - in: path
          name: delegationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delegation updated
        "400":
          description: Invalid payload
        "403":
          description: Permission denied
        "404":
          description: Delegation not found
  /approval/delegations/expire:
    post:
      summary: Expire active delegations that ended before cutoff time
      description: Deactivates active delegations where `endsAt < expiresBeforeAt` for an organization. Supports `dryRun=true` to preview results without mutation. Scheduled sweep runner reuses this endpoint behavior per organization.
      responses:
        "200":
          description: Expire result returned
        "400":
          description: Invalid payload
        "403":
          description: Permission denied
  /approval/templates:
    get:
      summary: List approval line templates
      description: Returns template stage definitions in `approvalStages`.
      parameters:
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
        - in: query
          name: domain
          required: false
          schema:
            type: string
            enum: [ATTENDANCE, LEAVE, PAYROLL]
        - in: query
          name: active
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Templates listed
        "403":
          description: Permission denied
    post:
      summary: Create approval line template
      description: PAYROLL domain templates may include optional `payrollGrossPayMinKrw` / `payrollGrossPayMaxKrw` conditions. Supports optional multi-stage definition payload `approvalStages`.
      responses:
        "201":
          description: Template created
        "400":
          description: Invalid payload
        "403":
          description: Permission denied
        "409":
          description: Active template conflict for same organization and domain
  /approval/templates/{templateId}:
    patch:
      summary: Update approval line template
      description: Supports updating optional PAYROLL gross-pay condition bounds and optional `approvalStages`.
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template updated
        "400":
          description: Invalid payload
        "403":
          description: Permission denied
        "404":
          description: Template not found
        "409":
          description: Active template conflict for same organization and domain
