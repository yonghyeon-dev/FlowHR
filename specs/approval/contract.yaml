owner: approval-agent
version: 0.2.0
scope:
  in:
    - organization-level approval policy for attendance/leave/payroll
    - approval delegation management with active time window
    - delegation auto-expiry command with dry-run support
    - approval gate enforcement on attendance/leave/payroll decision endpoints
  out:
    - multi-step approval chain routing
    - external groupware approval sync
entities:
  - name: ApprovalPolicy
    description: Organization-level domain-to-approver role mapping.
  - name: ApprovalDelegation
    description: Time-bounded delegation from delegator role to delegate actor.
api:
  auth:
    - role: admin
      permission: read/write approval policy and delegation
    - role: manager
      permission: read policy/delegation and create manager-level delegation
    - role: system
      permission: full approval policy/delegation operations
  endpoints:
    - method: GET
      path: /approval/policy
      description: Read organization approval policy (returns default fallback when not configured).
    - method: PUT
      path: /approval/policy
      description: Upsert organization approval policy.
    - method: GET
      path: /approval/delegations
      description: List approval delegations by organization/domain/active filter.
    - method: POST
      path: /approval/delegations
      description: Create approval delegation.
    - method: PATCH
      path: /approval/delegations/{delegationId}
      description: Update approval delegation (window/active/delegate).
    - method: POST
      path: /approval/delegations/expire
      description: Auto-expire active delegations ended before cutoff time (supports dryRun preview).
  events:
    published:
      - name: approval.policy.updated.v1
        description: Emitted when organization approval policy is updated.
      - name: approval.delegation.created.v1
        description: Emitted when approval delegation is created.
      - name: approval.delegation.updated.v1
        description: Emitted when approval delegation is updated.
    consumed: []
db_changes:
  migrations:
    - id: 202602180004_approval_policy_delegation
      description: Add approval policy/delegation tables and approval role permissions.
  backward_compatible: true
  notes: Additive schema change with role-permission seed using idempotent insert.
invariants:
  - Approval policy fallback defaults to manager(manager/payroll_operator) when no record exists.
  - Approval delegation must have endsAt greater than startsAt.
  - Expire command must deactivate only active delegations where endsAt is before expiresBeforeAt.
  - Expire command with dryRun=true must not mutate delegation state.
  - Approval execution requires both permission and policy/delegation gate.
  - Tenant-scoped actors cannot mutate policy/delegation for another organization.
risk:
  permissions:
    - Incorrect policy/delegation can block approvals or allow unintended approvers.
  payroll_accuracy:
    - Invalid payroll confirmation approver can impact release readiness and payroll closing timing.
  legal:
    - Approval authority changes must remain auditable.
test_plan:
  unit:
    - approval policy/delegation schema validation
    - delegation time-window guard
  integration:
    - read fallback policy without persisted row
    - upsert and read configured policy
    - create and deactivate delegation lifecycle
    - expire delegation dryRun/apply flow
    - manager non-manager delegation write blocked with 403
  regression:
    - attendance/leave/payroll approval endpoints enforce policy gate
  authorization:
    - policy/delegation endpoint permission checks
    - tenant boundary checks for policy/delegation mutation
  payroll_accuracy:
    - payroll confirm gate follows configured approver role/delegation
observability:
  audit_events:
    - approval.policy.updated
    - approval.delegation.created
    - approval.delegation.updated
    - approval.delegation.auto_expired
  metrics:
    - approval_policy_update_count
    - approval_delegation_active_count
    - approval_policy_gate_denied_count
  logs:
    - approval policy gate denial with expected role and actor context
rollout:
  feature_flags:
    - name: approval_policy_v1
      default: "on"
  migration_strategy: expand-contract
rollback:
  strategy: keep permission checks and temporarily set policy to defaults while disabling delegation updates.
  max_recovery_time: 30m
deprecations: []
breaking_changes: false
consumer_impact: "Contract v0.2.0 adds delegation auto-expiry command endpoint (`/approval/delegations/expire`) with dry-run mode while keeping existing approval policy/delegation APIs backward compatible."
references:
  - specs/common/time-and-payroll-rules.md
  - work-items/WI-0103-approval-line-delegation-policy.md
  - work-items/WI-0107-approval-delegation-expiry-automation.md
approval:
  spec_owner: orchestrator-agent
  qa_owner: qa-agent
