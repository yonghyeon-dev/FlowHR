owner: approval-agent
version: 0.10.0
scope:
  in:
    - organization-level approval policy for attendance/leave/payroll
    - approval delegation management with active time window
    - delegation auto-expiry command with dry-run support
    - multi-organization delegation expiry sweep runner for scheduled cleanup
    - domain approval line template management for role-set based gate override
    - payroll conditional routing baseline by gross-pay threshold in active template
    - multi-stage template stage-definition model (ordered stage roles/min approvals)
    - approval policy gate preview simulation API for policy/template/delegation pre-check
    - runtime gate stage-history persistence for attendance/leave/payroll decision endpoints
    - approval stage-history read API for gate troubleshooting
    - approval execution state machine for staged runtime actions on attendance/leave/payroll decisions
    - approval execution listing API for operator troubleshooting (priority sorting + stalled queue filtering)
    - approval execution admin UI with stalled-item prioritization and quick domain jump
    - approval execution stalled escalation command API with dry-run and webhook dispatch
    - approval execution stalled escalation scheduler runner for periodic multi-organization sweep
    - approval gate enforcement on attendance/leave/payroll decision endpoints
  out:
    - generic standalone approval command endpoint independent of domain action APIs
    - external groupware approval sync
entities:
  - name: ApprovalPolicy
    description: Organization-level domain-to-approver role mapping.
  - name: ApprovalDelegation
    description: Time-bounded delegation from delegator role to delegate actor.
  - name: ApprovalLineTemplate
    description: Organization-level domain approval template with stage definitions and active flag.
  - name: ApprovalStageHistory
    description: Persisted policy-gate evaluation result per target entity for audit/troubleshooting.
  - name: ApprovalExecution
    description: Runtime stage-by-stage approval execution state per target domain entity.
  - name: ApprovalExecutionActionLog
    description: Immutable action log for each stage approval/rejection decision.
api:
  auth:
    - role: admin
      permission: read/write approval policy, delegation, and templates
    - role: manager
      permission: read policy/delegation/templates and create manager-level delegation
    - role: system
      permission: full approval policy/delegation/template operations
  endpoints:
    - method: GET
      path: /approval/policy
      description: Read organization approval policy (returns default fallback when not configured).
    - method: PUT
      path: /approval/policy
      description: Upsert organization approval policy.
    - method: POST
      path: /approval/policy/gate-preview
      description: Preview approval gate result (expected roles/template match/delegation) without mutating state.
    - method: GET
      path: /approval/stage-history
      description: List persisted stage-gate evaluations by organization/domain/target entity filters.
    - method: GET
      path: /approval/executions
      description: List runtime approval execution states by organization/domain/target entity filters, with optional priority sort and stalled queue filters.
    - method: POST
      path: /approval/executions/escalate
      description: Trigger stalled approval execution escalation command with optional dry-run and webhook dispatch.
    - method: GET
      path: /approval/delegations
      description: List approval delegations by organization/domain/active filter.
    - method: POST
      path: /approval/delegations
      description: Create approval delegation.
    - method: PATCH
      path: /approval/delegations/{delegationId}
      description: Update approval delegation (window/active/delegate).
    - method: POST
      path: /approval/delegations/expire
      description: Auto-expire active delegations ended before cutoff time (supports dryRun preview).
    - method: GET
      path: /approval/templates
      description: List approval line templates by organization/domain/active filter.
    - method: POST
      path: /approval/templates
      description: Create approval line template (PAYROLL domain can include gross-pay min/max condition).
    - method: PATCH
      path: /approval/templates/{templateId}
      description: Update approval line template (name/domain/roles/condition/active).
  operations:
    - name: approval-delegation-expiry-sweep
      description: Scheduled runner executes delegation expire command per organization with dry-run/apply mode.
    - name: approval-execution-escalation-sweep
      description: Scheduled runner executes stalled approval execution escalation command per organization.
  events:
    published:
      - name: approval.policy.updated.v1
        description: Emitted when organization approval policy is updated.
      - name: approval.delegation.created.v1
        description: Emitted when approval delegation is created.
      - name: approval.delegation.updated.v1
        description: Emitted when approval delegation is updated.
      - name: approval.template.created.v1
        description: Emitted when approval line template is created.
      - name: approval.template.updated.v1
        description: Emitted when approval line template is updated.
      - name: approval.execution.escalation.requested.v1
        description: Emitted when stalled approval execution escalation dispatch is requested.
    consumed: []
db_changes:
  migrations:
    - id: 202602180004_approval_policy_delegation
      description: Add approval policy/delegation tables and approval role permissions.
    - id: 202602190001_approval_line_template
      description: Add approval line template table and tenant-domain active index.
    - id: 202602190002_approval_template_payroll_condition
      description: Add payroll gross-pay min/max columns to approval template for conditional PAYROLL routing.
    - id: 202602190004_approval_stage_history_baseline
      description: Add approval stage history table for runtime gate audit records.
    - id: 202602190005_approval_template_multi_stage
      description: Add JSON stage-definition payload for approval template multi-stage routing model.
    - id: 202602190006_approval_execution_state_machine
      description: Add approval execution/action-log tables and staged action runtime model.
  backward_compatible: true
  notes: Additive schema changes with template condition/stage payload, stage history table, and idempotent role-permission seed.
invariants:
  - Approval policy fallback defaults to manager(manager/payroll_operator) when no record exists.
  - Active approval line template for a given organization+domain is unique.
  - Active template approverRoles (deduped set) must contain at least one role.
  - approvalStages must have sequential unique indexes starting at 1 and maximum 5 stages.
  - Each approval stage minApprovals must be between 1 and approverRoles length.
  - Runtime gate compatibility mode must use stage-1 approverRoles as template approverRoles.
  - Approval execution state is terminal once REJECTED or APPROVED.
  - Stage action `APPROVE` advances to next stage only when stage minApprovals is satisfied (or privileged bypass).
  - Stage action `REJECT` finalizes execution as REJECTED immediately.
  - Domain entity finalization (attendance approved/rejected, leave approved/rejected, payroll confirmed) occurs only when execution is finalized.
  - payrollGrossPayMinKrw/payrollGrossPayMaxKrw are only allowed for PAYROLL template domain.
  - PAYROLL template condition applies when grossPayKrw is within [min,max] (null means open bound); otherwise gate falls back to policy role.
  - Approval gate uses active and matching template role set first; policy single-role fallback applies when no active/matching template exists.
  - Gate preview must use the same template/policy/delegation resolution logic as runtime approval gate.
  - Gate preview endpoint is read-only and must not mutate policy/delegation/template state.
  - Runtime approval gate with target entity context must append one stage-history record with deterministic resolution.
  - Stage-history listing endpoint is read-only and tenant scoped.
  - Approval delegation must have endsAt greater than startsAt.
  - Expire command must deactivate only active delegations where endsAt is before expiresBeforeAt.
  - Expire command with dryRun=true must not mutate delegation state.
  - Expiry sweep with empty organization list must target tenant scope (tenant actor) or all organizations (system actor).
  - Approval execution requires both permission and policy/delegation gate.
  - stalledHoursMin filter applies only to PENDING execution rows.
  - priority_desc sort must prioritize PENDING and stale rows before terminal states.
  - Approval execution escalation command evaluates only PENDING execution rows above stalledHoursMin threshold.
  - Approval execution escalation command with dryRun=true must not dispatch webhook side effects.
  - Tenant-scoped actors cannot mutate policy/delegation for another organization.
risk:
  permissions:
    - Incorrect policy/delegation can block approvals or allow unintended approvers.
  payroll_accuracy:
    - Invalid payroll confirmation approver can impact release readiness and payroll closing timing.
  legal:
    - Approval authority changes must remain auditable.
test_plan:
  unit:
    - approval policy/delegation schema validation
    - approval template schema validation (role dedupe, min role count)
    - delegation time-window guard
  integration:
    - read fallback policy without persisted row
    - upsert and read configured policy
    - create and deactivate delegation lifecycle
    - create/list/update approval template lifecycle
    - payroll template condition gate applies for matching grossPayKrw and falls back for non-matching grossPayKrw
    - gate preview returns expected roles/template match/delegation result for matched/non-matched payroll conditions
    - template create/update/list supports multi-stage payload and stage-1 compatibility mapping
    - stage-history query returns deny/allow gate evaluations for attendance/leave/payroll target entities
    - execution list query returns staged runtime state (`PENDING/APPROVED/REJECTED`) with stage position
    - execution list query supports `sort=priority_desc` and `stalledHoursMin` + `asOf` filtering
    - execution escalation command returns deterministic candidate ordering and dry-run summary
    - execution escalation command dispatch path emits webhook and runtime event when candidates exist
    - attendance/leave/payroll staged flow keeps target pending until final stage approval
    - reject duplicate active template in same organization+domain with 409
    - reject payroll condition fields for non-PAYROLL template domain
    - expire delegation dryRun/apply flow
    - expiry sweep dryRun/apply flow across multiple organizations
    - manager non-manager delegation write blocked with 403
  regression:
    - attendance/leave/payroll approval endpoints enforce policy gate
    - approval gate reflects template activation/deactivation changes
    - payroll confirm gate enforces conditional template route when threshold is matched
    - gate preview remains consistent with runtime gate decision outcomes
    - stage-enabled template keeps runtime gate behavior via stage-1 role mapping
    - staged execution mode keeps single-stage templates behavior unchanged
    - stage-history records keep deny/allow ordering with required roles and resolution labels
    - stage-history stageLabel includes action suffix for staged actions
    - execution list default ordering (`updated_desc`) remains backward compatible
    - execution escalation command with no candidates remains successful without webhook requirement
  authorization:
    - policy/delegation endpoint permission checks
    - template endpoint permission checks
    - tenant boundary checks for policy/delegation mutation
  payroll_accuracy:
    - payroll confirm gate follows configured approver role/delegation
observability:
  audit_events:
    - approval.policy.updated
    - approval.delegation.created
    - approval.delegation.updated
    - approval.delegation.auto_expired
    - approval.template.created
    - approval.template.updated
    - approval.policy_gate.previewed
    - approval.stage_history.listed
    - approval.execution.listed
    - approval.execution.escalation.generated
    - approval.execution.escalation.requested
    - approval.execution.escalation.failed
  metrics:
    - approval_policy_update_count
    - approval_delegation_active_count
    - approval_template_active_count
    - approval_policy_gate_denied_count
    - approval_stage_history_list_count
    - approval_execution_list_count
    - approval_execution_escalation_candidate_count
    - approval_execution_escalation_requested_count
    - approval_delegation_expire_sweep_checked_count
    - approval_delegation_expire_sweep_applied_count
  logs:
    - approval policy gate denial with expected role and actor context
rollout:
  feature_flags:
    - name: approval_policy_v1
      default: "on"
  migration_strategy: expand-contract
rollback:
  strategy: keep permission checks and temporarily set policy to defaults while disabling delegation updates.
  max_recovery_time: 30m
deprecations: []
breaking_changes: false
consumer_impact: "Contract v0.10.0 adds stalled escalation command endpoint (`POST /approval/executions/escalate`) and scheduler operation metadata while preserving existing policy/delegation/template/execution list behavior."
references:
  - specs/common/time-and-payroll-rules.md
  - work-items/WI-0103-approval-line-delegation-policy.md
  - work-items/WI-0107-approval-delegation-expiry-automation.md
  - work-items/WI-0108-approval-delegation-expiry-scheduler.md
  - work-items/WI-0109-approval-line-template-baseline.md
  - work-items/WI-0113-approval-template-payroll-conditional-routing.md
  - work-items/WI-0115-approval-gate-preview.md
  - work-items/WI-0116-approval-stage-history-baseline.md
  - work-items/WI-0117-approval-template-multi-stage-baseline.md
  - work-items/WI-0118-approval-execution-state-machine.md
  - work-items/WI-0121-approval-execution-priority-and-stalled-queue.md
  - work-items/WI-0123-approval-execution-stalled-escalation-automation.md
approval:
  spec_owner: orchestrator-agent
  qa_owner: qa-agent
