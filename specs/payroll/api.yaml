openapi: 3.1.0
info:
  title: FlowHR Payroll API
  version: 1.18.0
paths:
  /payroll/runs:
    get:
      summary: List payroll runs by period
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum: [PREVIEWED, CONFIRMED]
      responses:
        "200":
          description: Runs listed
  /payroll/deduction-profiles:
    get:
      summary: List deduction profiles
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [manual, profile]
      responses:
        "200":
          description: Profiles listed
  /payroll/runs/preview:
    post:
      summary: Create payroll gross pay preview
      responses:
        "200":
          description: Preview generated
  /payroll/runs/preview-with-deductions:
    post:
      summary: Create payroll preview with deduction and tax components (manual/profile/statutory_kr_baseline mode)
      description: In profile mode, `expectedProfileVersion` can be provided to reject stale profile usage with `409`. In statutory_kr_baseline mode, baseline KR withholding/social insurance components are derived from configurable rates with optional `incomeTaxBrackets`, insurance cap fields (`nationalPensionCapKrw`, `healthInsuranceCapKrw`, `employmentInsuranceCapKrw`), additive tax-credit fields (`additionalTaxCreditKrw`, `dependentCount`, `dependentTaxCreditPerPersonKrw`), and optional monthly-boundary guard (`requireMonthlyBoundary`).
      responses:
        "200":
          description: Deduction preview generated
  /payroll/runs/preview-insurance-settlement:
    post:
      summary: Create payroll 4-insurance settlement preview (employee/employer contribution and delta)
      description: Computes employee/employer national pension, health insurance, long-term care, employment insurance, and industrial accident components with optional caps and prior-withheld/prior-paid deltas.
      responses:
        "200":
          description: Insurance settlement preview generated
  /payroll/runs/close-period:
    post:
      summary: Preview or apply payroll period close with withholding settlement delta
      description: Summarizes confirmed payroll runs for a period and computes withholding/social/net deltas against prior-paid values. `apply=true` is rejected when unconfirmed runs remain.
      responses:
        "200":
          description: Payroll period close summary generated
  /payroll/payslips/distribute:
    post:
      summary: Preview or apply confirmed payslip distribution
      description: Distributes confirmed payroll runs as payslips by period/employee scope and records delivery metadata (`in_app`/`email`). `dryRun=true` returns summary without updates.
      responses:
        "200":
          description: Payslip distribution summary generated
  /payroll/payslips/{runId}/acknowledge:
    post:
      summary: Confirm payslip receipt for distributed confirmed run
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payslip receipt confirmed
  /payroll/year-end/preview-settlement:
    post:
      summary: Preview payroll year-end settlement for employee
      description: Aggregates confirmed payroll runs for the selected year and employee, then computes annual withholding settlement delta.
      responses:
        "200":
          description: Year-end settlement summary generated
  /payroll/year-end/recalculate-settlement:
    post:
      summary: Recalculate payroll year-end settlement with deduction items
      description: Accepts employee/year deduction-item inputs and returns baseline vs recalculated year-end settlement deltas for the same confirmed annual run set.
      responses:
        "200":
          description: Year-end settlement recalculation summary generated
  /payroll/year-end/finalize-settlement:
    post:
      summary: Preview or apply payroll year-end settlement finalization
      description: Validates confirmed/distributed/receipt-confirmed prerequisites for selected employee/year and returns finalization summary. `apply=true` records finalization audit/event.
      responses:
        "200":
          description: Year-end settlement finalization summary generated
  /payroll/year-end/export-filing-data:
    post:
      summary: Export payroll year-end filing data for employee/year
      description: Exports filing-ready annual payroll data for selected employee/year after settlement finalization, with multi-format output (`json`, `csv`, `jsonl`, `hometax_csv`) and validation mode (`basic`/`strict`).
      responses:
        "200":
          description: Year-end filing export generated
  /payroll/year-end/filing-submissions:
    get:
      summary: List payroll year-end filing submissions for employee/year
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
        - in: query
          name: employeeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Filing submissions listed
    post:
      summary: Submit payroll year-end filing package
      description: Creates filing submission tracking record using latest finalized/exported artifact metadata and transport channel.
      responses:
        "200":
          description: Filing submission created
  /payroll/year-end/filing-submissions/{submissionId}/ack:
    post:
      summary: Acknowledge payroll year-end filing submission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Filing submission acknowledged
  /payroll/year-end/filing-submissions/{submissionId}/resubmit:
    post:
      summary: Resubmit rejected payroll year-end filing submission
      description: Creates a new filing submission attempt only when target submission is acknowledged as rejected and no pending submission exists.
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Filing submission resubmitted
  /payroll/year-end/filing-submissions/{submissionId}/timeline:
    get:
      summary: List payroll year-end filing submission timeline
      description: Returns ordered timeline events for selected submission (submitted/resubmitted, acknowledgement, evidence notes).
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
        - in: query
          name: year
          required: true
          schema:
            type: integer
        - in: query
          name: employeeId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Filing submission timeline listed
  /payroll/year-end/filing-submissions/{submissionId}/evidence-note:
    post:
      summary: Append payroll year-end filing evidence note
      description: Appends operator evidence note to selected filing submission for compliance traceability.
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Filing evidence note appended
  /payroll/year-end/withholding-receipts:
    post:
      summary: Preview or issue withholding receipt for employee/year
      description: Returns withholding receipt readiness summary. When `issue=true`, issuance is blocked until all yearly runs are confirmed, distributed, and receipt-confirmed.
      responses:
        "200":
          description: Withholding receipt summary generated
  /payroll/runs/{runId}/confirm:
    post:
      summary: Confirm payroll run
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payroll run confirmed
  /payroll/deduction-profiles/{profileId}:
    get:
      summary: Read deduction profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deduction profile returned
    put:
      summary: Create or update deduction profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deduction profile upserted
