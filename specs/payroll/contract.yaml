    - manual/profile mode deduction and net-pay aggregation formula
    - statutory_kr_baseline mode deduction component and net-pay aggregation formula
    - statutory_kr_baseline progressive bracket and contribution-cap formulas
    - statutory_kr_baseline simple withholding lookup-table selection formula
    - statutory_kr_baseline lookup-table preset dataset resolution formula
    - statutory_kr_baseline taxable/non-taxable split validation formula
    - statutory_kr_baseline income split item list/total validation formula
    - statutory_kr_baseline income split item preset resolution and mutual-exclusion validation formula
    - statutory_kr_baseline insurance rounding unit/mode formulas
    - statutory_kr_baseline tax-credit and monthly-boundary formulas
    - insurance settlement contribution, cap, and delta formulas
    - close-period totals, blocking, and delta formulas
    - payslip distribution target selection and idempotent delivery state updates
    - payslip receipt confirmation ownership/distributed-state guards
    - year-end settlement tax-liability and withholding-delta formulas
    - year-end settlement withholding breakdown formulas (`additionalWithholdingDueKrw`/`withholdingRefundKrw`)
    - year-end settlementHash generation and stale-apply expectedSettlementHash guard formula
    - year-end filing export expectedSettlementHash guard and settlementHash trace formulas
    - year-end non-taxable annual income upper-bound guard formula
    - year-end settlement recalculation baseline-vs-deduction-input delta formulas
    - year-end deduction eligibility validation guard formulas
    - year-end deduction item caps and cap-applied breakdown formulas
    - year-end tax credit caps and cap-applied breakdown formulas
    - year-end finalization guard chain and finalization payload formulas
    - year-end filing export row/csv formatter determinism
    - year-end filing export multi-format artifact builder and checksum determinism
    - year-end filing export validation checks and strict-mode blocking behavior
    - year-end filing submission summary builder and ack state transition formulas
    - year-end filing ack code dictionary and rejection reason catalog resolution formulas
    - year-end filing resubmission state-transition guard formulas
    - year-end filing cancel/reopen transition guard formulas
    - year-end filing submission list filter/search/sort and summary builder formulas
    - year-end filing timeline event builder and ordering formulas
    - year-end filing evidence-note append payload formulas
    - withholding receipt issue guard (confirmed/distributed/receipt-confirmed chain)
    - rounding behavior for KRW totals
    - payroll run list query parsing and role guard
    - deduction profile list query parsing and role guard
  integration:
    - payroll preview rejects unknown employeeId (404)
    - consume attendance.approved and produce payroll preview
    - preview-with-deductions and confirm flow
    - preview-with-deductions statutory_kr_baseline mode flow
    - deduction profile CRUD and authorization checks
    - profile mode preview rejects stale expected profile version
    - list payroll runs by period returns expected rows
    - employees can list their own CONFIRMED runs for payslip self-service, but are blocked from other employees and PREVIEWED runs
    - list deduction profiles and filter by active/mode
    - statutory_kr_baseline validates progressive bracket ordering/open-ended final bracket
    - statutory_kr_baseline validates lookup-table ordering/open-ended final row, monotonic tax values, and mutual exclusivity with brackets/preset
    - statutory_kr_baseline resolves managed lookup-table preset ID and rejects unknown preset IDs
    - statutory_kr_baseline validates taxable/non-taxable split guard (`nonTaxableIncomeKrw <= grossPayKrw`, explicit taxable split sum match)
    - statutory_kr_baseline validates income split item list code uniqueness and item-total consistency with split totals
    - statutory_kr_baseline resolves income split item preset ID and rejects unknown/mutually-exclusive manual item combinations
    - admin payroll preview multi-item table UX keeps deterministic split-item array payload wiring
    - admin payroll preview item-code dictionary autocomplete keeps deterministic code/category payload composition
    - statutory_kr_baseline validates split-item code/category parity against server dictionary by taxable/non-taxable kind
    - admin payroll preview preset/manual split-item consistency guide shows deterministic pre-submit blocking hints
    - admin payroll preview preset-mode sample payload panel shows deterministic request shape and template application hints
    - admin payroll preview preset-mode sample payload panel supports deterministic copy/share UX with replay href context
    - admin payroll preview preset share-link query parser auto-applies valid preset/split inputs and ignores invalid values deterministically
    - admin payroll preview preset share-link feedback panel shows applied query values and ignored invalid query values deterministically
    - admin payroll preview preset share-link reset/reapply actions deterministically clear share-applied values and re-hydrate from current query
    - statutory_kr_baseline validates optional monthly-boundary guard in Asia/Seoul
    - preview-insurance-settlement returns employee/employer contributions, capped bases, rounding/raw trace, and prior-withheld/prior-paid deltas
    - preview-insurance-settlement rejects requests when payroll_kr_insurance_settlement_v1 is disabled
    - preview-insurance-settlement validates monthly-boundary guard in Asia/Seoul when requireMonthlyBoundary=true
    - close-period preview returns run-state summary (confirmed/previewed) and withholding/social/net settlement deltas
    - close-period apply rejects requests when unconfirmed runs remain
    - close-period rejects requests when payroll_close_period_v1 is disabled
    - payslip distribution dry-run/apply returns deterministic run-state summary and delivery counts
    - payslip receipt confirmation rejects non-owner employees and undistributed runs
    - payslip distribution/receipt APIs reject requests when payroll_payslip_delivery_v1 is disabled
    - year-end settlement preview returns annual totals/tax-liability/withholding-delta deterministically for employee/year
    - year-end settlement preview/recalculation/finalization/export includes deterministic withholding refund/additional-due breakdown for same employee/year run set
