owner: payroll-agent
version: 1.23.0
scope:
  in:
    - gross pay preview from approved attendance aggregates
    - payroll run trace and audit logging
    - payroll run list query by period
    - deduction and tax contract artifacts for phase 2 rollout
    - deduction profile policy and profile-mode preview
    - deduction profile list query
    - profile version expectation guard for deterministic preview
    - KR statutory baseline deduction mode for payroll preview (income tax + 4-insurance approximation)
    - KR statutory baseline progressive income-tax brackets and insurance contribution caps
    - KR statutory baseline additive tax-credit inputs and optional monthly-boundary validation (Asia/Seoul)
    - golden fixture regression coverage for statutory KR baseline deduction outputs
    - KR 4-insurance settlement preview with employee/employer contribution deltas and prior-withheld reconciliation
    - payroll withholding settlement and period-close preview/apply workflow for confirmed payroll runs
    - payslip distribution and employee receipt confirmation workflow for confirmed payroll runs
    - year-end settlement preview and withholding receipt preview/issue workflow for employee annual payroll totals
    - year-end deduction-item input and settlement recalculation workflow for employee annual payroll totals
    - year-end settlement finalization and filing-data export workflow for employee annual payroll totals
    - year-end filing export multi-format artifact generation and validation-mode guard (`basic`/`strict`)
    - year-end filing submission tracking and acknowledgement workflow for employee annual payroll totals
    - year-end filing package resubmission and submission-state transition guard workflow
    - year-end filing submission timeline and evidence-note trace workflow
    - year-end filing acknowledgement code dictionary and rejection-reason catalog workflow
    - year-end filing submission cancel/reopen transition guard workflow
    - year-end filing submission search/sort and quick-action workflow
    - year-end filing ops dashboard split and evidence/status summary-card workflow
  out:
    - country-specific legal tax engine implementation
    - external remittance and filing
    - bank transfer execution
entities:
  - name: PayrollPeriod
    description: Payroll cycle boundary and state.
  - name: PayrollRun
    description: Payroll computation run with status and source snapshot.
  - name: PayrollItem
    description: Per-employee gross pay components.
  - name: DeductionProfile
    description: Versioned deduction policy (rate/fixed components) for auto calculation mode.
api:
  auth:
    - role: payroll_operator
      permission: run payroll preview (including 4-insurance settlement preview), preview/apply period close, distribute payslips, preview/issue/recalculate/finalize year-end settlement, export/submit/resubmit/cancel/reopen/ack/list/filter/summarize timeline/add evidence-note/list ack-catalog filing data packages, list runs, list/manage deduction profiles, and confirm run
    - role: admin
      permission: full payroll operations
    - role: employee
      permission: list own confirmed payroll runs for payslip self-service, confirm own payslip receipt, and preview own year-end withholding receipt (employeeId must match actor id)
  endpoints:
    - method: GET
      path: /payroll/runs
      description: List payroll runs filtered by period (from/to) and optional employeeId/state.
    - method: GET
      path: /payroll/deduction-profiles
      description: List deduction profiles with optional active/mode filters.
    - method: POST
      path: /payroll/runs/preview
      description: Generate payroll gross pay preview for a period.
    - method: POST
      path: /payroll/runs/preview-with-deductions
      description: Generate payroll preview with deduction and tax components (manual/profile/statutory_kr_baseline mode with optional progressive tax brackets, contribution caps, additive tax-credit fields, and optional monthly-boundary validation).
    - method: POST
      path: /payroll/runs/preview-insurance-settlement
      description: Generate 4-insurance settlement preview with employee/employer contribution breakdown, optional caps, and prior-withheld/prior-paid deltas.
    - method: POST
      path: /payroll/runs/close-period
      description: Preview/apply payroll period close from confirmed runs with withholding/social/net settlement deltas and blocking reasons when unconfirmed runs remain.
    - method: POST
      path: /payroll/payslips/distribute
      description: Preview/apply confirmed payslip distribution by period with delivery metadata (`in_app`/`email`) and per-run delivery status.
    - method: POST
      path: /payroll/payslips/{runId}/acknowledge
      description: Confirm payslip receipt for distributed confirmed run (employee own run or payroll admin/operator override).
    - method: POST
      path: /payroll/year-end/preview-settlement
      description: Preview annual payroll withholding settlement for selected employee and year with tax liability and withholding delta summary.
    - method: POST
      path: /payroll/year-end/recalculate-settlement
      description: Recalculate annual payroll withholding settlement using deduction-item inputs and return baseline-vs-recalculated delta summary.
    - method: POST
      path: /payroll/year-end/finalize-settlement
      description: Preview or apply year-end settlement finalization with confirmed/distributed/receipt-confirmed guard chain and finalization audit trace.
    - method: POST
      path: /payroll/year-end/export-filing-data
      description: Export filing-ready year-end payroll data for selected employee/year using latest finalized settlement payload with multi-format output (`json`/`csv`/`jsonl`/`hometax_csv`) and validation mode.
    - method: GET
      path: /payroll/year-end/filing-submissions
      description: List filing submission tracking rows for selected employee/year with optional status/ackStatus/validationStatus/transport filters, search/sort controls, and summary counters.
    - method: POST
      path: /payroll/year-end/filing-submissions
      description: Submit filing package using latest finalized/exported artifact metadata and selected transport.
    - method: POST
      path: /payroll/year-end/filing-submissions/{submissionId}/ack
      description: Acknowledge filing submission outcome (`accepted`/`rejected`) with ack code and note.
    - method: GET
      path: /payroll/year-end/filing-ack-catalog
      description: List acknowledgement code dictionary and rejection reason catalog for filing acknowledgement workflow.
    - method: POST
      path: /payroll/year-end/filing-submissions/{submissionId}/resubmit
      description: Create next filing submission attempt from rejected acknowledged submission with transition guards.
    - method: POST
      path: /payroll/year-end/filing-submissions/{submissionId}/cancel
      description: Cancel selected pending filing submission (`submitted`) with transition guard and audit trail.
    - method: POST
      path: /payroll/year-end/filing-submissions/{submissionId}/reopen
      description: Reopen selected canceled filing submission when no other pending submission exists.
    - method: GET
      path: /payroll/year-end/filing-submissions/{submissionId}/timeline
      description: List selected filing submission timeline events (submit/resubmit/cancel/reopen, ack, evidence notes) in deterministic order.
    - method: POST
      path: /payroll/year-end/filing-submissions/{submissionId}/evidence-note
      description: Add evidence note to selected filing submission for compliance traceability.
    - method: POST
      path: /payroll/year-end/withholding-receipts
      description: Preview or issue withholding receipt for selected employee/year; issuance requires confirmed+distributed+receipt-confirmed run chain.
    - method: POST
      path: /payroll/runs/{runId}/confirm
      description: Confirm a payroll run.
    - method: GET
      path: /payroll/deduction-profiles/{profileId}
      description: Read deduction profile definition and current version.
    - method: PUT
      path: /payroll/deduction-profiles/{profileId}
      description: Create or update deduction profile for auto calculation mode.
  events:
    published:
      - name: payroll.calculated.v1
        description: Emitted when gross pay calculation is completed.
      - name: payroll.confirmed.v1
        description: Emitted when payroll run is confirmed.
      - name: payroll.deductions.calculated.v1
        description: Emitted when deduction/tax preview is calculated.
      - name: payroll.deduction_profile.updated.v1
        description: Emitted when deduction profile configuration changes.
      - name: payroll.insurance_settlement.previewed.v1
        description: Emitted when 4-insurance settlement preview is calculated.
      - name: payroll.period.close_previewed.v1
        description: Emitted when payroll period close summary is previewed.
      - name: payroll.period.closed.v1
        description: Emitted when payroll period close is applied.
      - name: payroll.payslip.distribution_previewed.v1
        description: Emitted when payslip distribution dry-run summary is generated.
      - name: payroll.payslip.distributed.v1
        description: Emitted when payslip delivery is applied for confirmed runs.
      - name: payroll.payslip.receipt_confirmed.v1
        description: Emitted when employee payslip receipt is confirmed.
      - name: payroll.year_end.settlement.previewed.v1
        description: Emitted when payroll year-end settlement summary is previewed.
      - name: payroll.year_end.settlement.recalculated.v1
        description: Emitted when payroll year-end settlement is recalculated with deduction-item inputs.
      - name: payroll.year_end.settlement.finalize_previewed.v1
        description: Emitted when year-end settlement finalization readiness is previewed.
      - name: payroll.year_end.settlement.finalized.v1
        description: Emitted when year-end settlement finalization is applied.
      - name: payroll.year_end.filing_data.exported.v1
        description: Emitted when finalized year-end filing data is exported.
      - name: payroll.year_end.filing_package.submitted.v1
        description: Emitted when year-end filing package is submitted.
      - name: payroll.year_end.filing_package.resubmitted.v1
        description: Emitted when rejected year-end filing package is resubmitted.
      - name: payroll.year_end.filing_package.canceled.v1
        description: Emitted when pending year-end filing package is canceled.
      - name: payroll.year_end.filing_package.reopened.v1
        description: Emitted when canceled year-end filing package is reopened.
      - name: payroll.year_end.filing_package.acknowledged.v1
        description: Emitted when year-end filing package acknowledgement is recorded.
      - name: payroll.year_end.filing_evidence_note.added.v1
        description: Emitted when filing evidence note is added to a submission.
      - name: payroll.year_end.withholding_receipt.previewed.v1
        description: Emitted when withholding receipt readiness is previewed.
      - name: payroll.year_end.withholding_receipt.issued.v1
        description: Emitted when withholding receipt is issued.
    consumed:
      - name: attendance.approved.v1
        description: Approved attendance aggregate input.
      - name: attendance.corrected.v1
        description: Correction-triggered recalculation input.
db_changes:
  migrations:
    - id: 202602130001_init_wi0001
      description: Create PayrollRun base table.
    - id: 202602130002_wi0001_api_extensions
      description: Extend PayrollRun and add AuditLog for payroll traceability.
    - id: 202602140003_payroll_phase2_contract_base
      description: Add additive deduction and net-pay trace fields to PayrollRun.
    - id: 202602140004_payroll_phase2_deduction_profile
      description: Add DeductionProfile table and profile trace columns on PayrollRun.
    - id: 202602140006_employee_fk_constraints
      description: Backfill Employee rows and enforce employeeId FK constraints for core tables.
    - id: 202602210001_wi0186_payroll_payslip_delivery_receipt
      description: Add payslip delivery/receipt tracking columns on PayrollRun.
  backward_compatible: true
  notes: Phase2 adds optional profile-based deduction calculation while keeping manual mode.
invariants:
  - Gross pay is deterministic for same inputs and rules.
  - Net pay equals gross pay minus total deductions when phase2 fields are populated.
  - Profile-mode preview must persist profile ID and version trace.
  - Profile-mode preview rejects request when expected profile version mismatches current profile version.
  - Statutory KR baseline mode must derive taxable base as max(grossPayKrw - nonTaxableIncomeKrw, 0).
  - Statutory KR baseline mode must keep deduction and net-pay outputs deterministic for same inputs/rates.
  - When incomeTaxBrackets is provided, statutory income tax must be calculated by bracket segments and include open-ended final bracket.
  - Insurance contribution caps (if provided) must bound each insurance contribution base deterministically.
  - Tax credits in statutory mode must apply to income tax before local income tax, and post-credit income tax must not be negative.
  - When statutory.requireMonthlyBoundary is true, payroll period must be validated against monthly boundary in Asia/Seoul.
  - Insurance settlement preview must derive taxable base as max(grossPayKrw - nonTaxableIncomeKrw, 0) and keep contribution components deterministic for same inputs/rates/caps.
  - Insurance settlement deltas must satisfy employeeDeltaKrw = employeeContributionTotalKrw - priorWithheldKrw and employerDeltaKrw = employerContributionTotalKrw - priorEmployerPaidKrw.
  - Insurance settlement preview with requireMonthlyBoundary=true must reject non-monthly period boundaries in Asia/Seoul.
  - Payroll period close totals must be derived from CONFIRMED runs in period and keep deterministic aggregation for same run set.
  - Payroll period close apply is blocked when any PREVIEWED run remains in selected period.
  - Payroll period close settlement deltas must satisfy `withholdingTaxDeltaKrw = totalWithholdingTaxKrw - priorPaidWithholdingTaxKrw`, `socialInsuranceDeltaKrw = totalSocialInsuranceKrw - priorPaidSocialInsuranceKrw`, and `netPayDeltaKrw = totalNetPayKrw - priorPaidNetPayKrw`.
  - Payslip distribution targets only CONFIRMED runs and records deterministic delivery metadata per run.
  - Payslip receipt confirmation is allowed only for distributed CONFIRMED runs and must persist confirmation actor/time.
  - Year-end settlement must aggregate CONFIRMED runs for selected employee/year and compute deterministic annual tax liability and withholding delta for same input.
  - Year-end settlement recalculation must apply deduction-item inputs as bounded income deductions and return deterministic baseline-vs-recalculated delta for same run/input set.
  - Year-end settlement finalization apply must be blocked unless all selected year runs are confirmed, distributed, and receipt-confirmed.
  - Year-end filing data export must require latest finalized settlement payload for selected employee/year.
  - Year-end filing data export records and csv output must remain deterministic for same finalized payload and run set.
  - Year-end filing data export artifact checksum must remain deterministic for same finalized payload, run set, and format.
  - Year-end filing data export with validationMode=`strict` must be blocked when validation checks fail.
  - Year-end filing submission must reference existing finalized/exported artifact metadata and remain traceable by unique submissionId.
  - Year-end filing acknowledgement is allowed only for existing non-acknowledged submission IDs.
  - Year-end filing acknowledgement must reject canceled submission IDs.
  - Year-end filing acknowledgement ackCode must be selected from ackStatus-specific ACK code dictionary.
  - Year-end filing acknowledgement rejectionReasonCode (when provided) must be selected from rejection reason catalog.
  - Year-end filing workflow must allow at most one pending (`submitted`) submission per employee/year.
  - Year-end filing resubmission is allowed only when source submission is acknowledged with `rejected` status.
  - Year-end filing cancel is allowed only when target submission status is `submitted`.
  - Year-end filing reopen is allowed only when target submission status is `canceled` and no other pending submission exists.
  - Year-end filing evidence note is allowed only for existing filing submission IDs within same employee/year scope.
  - Year-end filing timeline query must return deterministic chronological event order for submit/resubmit/cancel/reopen/ack/evidence-note history.
  - Year-end filing submission list filters (status/ackStatus/validationStatus/transport) must return deterministic subsets for same submission history.
  - Year-end filing submission summary counters must be computed from same submission history and remain deterministic under repeated query replay.
  - Year-end filing ops dashboard status/evidence summary cards must be derived deterministically from filing list/timeline data for same query and history.
  - Withholding receipt issue is blocked unless all selected year runs are confirmed, distributed, and receipt-confirmed.
  - Payroll preview includes source attendance snapshot reference.
  - Recalculation after correction keeps immutable audit trail.
  - Payroll run list API is restricted to payroll_operator/admin roles, with employee self-service allowed for own CONFIRMED runs only.
  - Deduction profile list API is restricted to payroll_operator/admin roles.
  - PayrollRun.employeeId (when set) must reference existing Employee.id (FK enforced).
risk:
  permissions:
    - Unauthorized deduction profile mutation can impact payroll outcomes.
    - Unauthorized payroll run confirmation can lock wrong results.
    - Unauthorized payslip distribution or receipt confirmation can break payroll compliance trail.
    - Unauthorized year-end deduction-item recalculation can distort compliance decision context.
    - Unauthorized year-end finalization or filing export can break statutory reporting evidence.
    - Unauthorized filing submission/acknowledgement can corrupt statutory filing trail.
    - Invalid ACK code/rejection-reason combinations can distort filing acknowledgement trace quality.
    - Unauthorized filing resubmission can bypass rejection controls and corrupt submission timeline.
    - Unauthorized filing cancel/reopen can corrupt filing state-transition trace.
    - Unauthorized filing summary/filter query can expose submission-state metadata.
    - Unauthorized filing evidence-note write can tamper compliance evidence trail.
    - Unauthorized filing timeline read can expose sensitive filing metadata.
    - Unauthorized withholding receipt issuance can break statutory compliance evidence.
  payroll_accuracy:
    - Misapplied overtime/night/holiday multipliers affect compensation.
    - Miscalculated deduction aggregation affects net pay accuracy.
    - Stale deduction profile version can produce incorrect net pay.
    - Statutory baseline rates are approximation-only and require policy/legal review before production default.
    - Incorrect tax-credit ordering (after/before local income tax) can cause payout mismatch.
    - Monthly boundary misconfiguration can produce off-cycle payroll previews.
    - Insurance settlement cap/rate misconfiguration can cause employee/employer contribution mismatch.
    - Closing period with unconfirmed runs can cause settlement mismatch.
    - Mis-entered year-end deduction-item inputs can skew annual settlement deltas.
    - Exporting filing data from stale/non-finalized settlement can cause reporting mismatch.
    - Filing format mapping or validation drift can cause statutory submission rejection.
  legal:
    - Payroll trace must support audit and dispute resolution.
test_plan:
  unit:
    - gross pay calculator with multiplier rules
    - manual/profile mode deduction and net-pay aggregation formula
    - statutory_kr_baseline mode deduction component and net-pay aggregation formula
    - statutory_kr_baseline progressive bracket and contribution-cap formulas
    - statutory_kr_baseline tax-credit and monthly-boundary formulas
    - insurance settlement contribution, cap, and delta formulas
    - close-period totals, blocking, and delta formulas
    - payslip distribution target selection and idempotent delivery state updates
    - payslip receipt confirmation ownership/distributed-state guards
    - year-end settlement tax-liability and withholding-delta formulas
    - year-end settlement recalculation baseline-vs-deduction-input delta formulas
    - year-end finalization guard chain and finalization payload formulas
    - year-end filing export row/csv formatter determinism
    - year-end filing export multi-format artifact builder and checksum determinism
    - year-end filing export validation checks and strict-mode blocking behavior
    - year-end filing submission summary builder and ack state transition formulas
    - year-end filing ack code dictionary and rejection reason catalog resolution formulas
    - year-end filing resubmission state-transition guard formulas
    - year-end filing cancel/reopen transition guard formulas
    - year-end filing submission list filter/search/sort and summary builder formulas
    - year-end filing timeline event builder and ordering formulas
    - year-end filing evidence-note append payload formulas
    - withholding receipt issue guard (confirmed/distributed/receipt-confirmed chain)
    - rounding behavior for KRW totals
    - payroll run list query parsing and role guard
    - deduction profile list query parsing and role guard
  integration:
    - payroll preview rejects unknown employeeId (404)
    - consume attendance.approved and produce payroll preview
    - preview-with-deductions and confirm flow
    - preview-with-deductions statutory_kr_baseline mode flow
    - deduction profile CRUD and authorization checks
    - profile mode preview rejects stale expected profile version
    - list payroll runs by period returns expected rows
    - employees can list their own CONFIRMED runs for payslip self-service, but are blocked from other employees and PREVIEWED runs
    - list deduction profiles and filter by active/mode
    - statutory_kr_baseline validates progressive bracket ordering/open-ended final bracket
    - statutory_kr_baseline validates optional monthly-boundary guard in Asia/Seoul
    - preview-insurance-settlement returns employee/employer contributions, capped bases, and prior-withheld/prior-paid deltas
    - preview-insurance-settlement rejects requests when payroll_kr_insurance_settlement_v1 is disabled
    - preview-insurance-settlement validates monthly-boundary guard in Asia/Seoul when requireMonthlyBoundary=true
    - close-period preview returns run-state summary (confirmed/previewed) and withholding/social/net settlement deltas
    - close-period apply rejects requests when unconfirmed runs remain
    - close-period rejects requests when payroll_close_period_v1 is disabled
    - payslip distribution dry-run/apply returns deterministic run-state summary and delivery counts
    - payslip receipt confirmation rejects non-owner employees and undistributed runs
    - payslip distribution/receipt APIs reject requests when payroll_payslip_delivery_v1 is disabled
    - year-end settlement preview returns annual totals/tax-liability/withholding-delta deterministically for employee/year
    - year-end settlement recalculation returns baseline/recalculated settlement and taxable-income delta deterministically for same employee/year run set
    - year-end settlement finalization preview/apply returns deterministic guard and finalization summary for same employee/year run set
    - year-end filing export rejects requests before finalization and returns deterministic row/csv output after finalization
    - year-end filing export returns deterministic artifact checksum/content for `json`/`csv`/`jsonl`/`hometax_csv`
    - year-end filing export strict validation mode rejects exports when finalized totals and current run rows mismatch
    - year-end filing submission create/list/ack flow returns deterministic submission state transitions
    - year-end filing acknowledgement rejects ack codes outside ack-status catalog and unknown rejection reason codes
    - year-end filing resubmit rejects pending/non-rejected/already-resubmitted source submissions
    - year-end filing cancel/reopen rejects invalid transitions (already canceled/acknowledged/non-canceled targets)
    - year-end filing timeline returns submit/resubmit/cancel/reopen/ack/evidence-note events for selected submission
    - year-end filing submission list returns deterministic summary counters and filtered subsets by status/ackStatus/validationStatus/transport/search/sort query
    - year-end filing evidence-note rejects unknown submission and disabled flag state
    - withholding receipt issue rejects issuance when previewed/undistributed/pending-receipt runs remain
    - year-end APIs reject requests when payroll_year_end_v1 is disabled
    - year-end recalculation API rejects requests when payroll_year_end_deduction_input_v1 is disabled
    - year-end finalization/export APIs reject requests when payroll_year_end_filing_export_v1 is disabled
