openapi: 3.1.0
info:
  title: FlowHR Attendance API
  version: 1.17.1
paths:
  /attendance/records:
    get:
      summary: List attendance records by period
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        "200":
          description: Records listed
    post:
      summary: Create attendance record
      description: Employee writes may require GPS capture metadata, single/multi-site geofence validation, trusted device allowlist checks, device attestation validation, and anti-spoofing signal-fusion with dynamic external reputation multi-provider/circuit-breaker/adaptive-routing/auto-heal orchestration when related policy flags are enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - employeeId
                - checkInAt
              properties:
                employeeId:
                  type: string
                checkInAt:
                  type: string
                  format: date-time
                checkOutAt:
                  type: string
                  format: date-time
                breakMinutes:
                  type: integer
                isHoliday:
                  type: boolean
                notes:
                  type: string
                capture:
                  $ref: "#/components/schemas/AttendanceCaptureCreate"
      responses:
        "201":
          description: Created
  /attendance/aggregates:
    get:
      summary: List attendance aggregates by period
      description: Totals are derived from approved attendance records only and grouped by employee.
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: employeeId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Aggregates listed
  /attendance/records/{recordId}:
    get:
      summary: Read a single attendance record
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Record returned
        "401":
          description: Unauthorized
        "404":
          description: Record not found
    patch:
      summary: Update attendance record before approval
      description: Employee updates may require effective GPS capture metadata, single/multi-site geofence validation, trusted device checks, device attestation validation, and anti-spoofing signal-fusion with dynamic external reputation multi-provider/circuit-breaker/adaptive-routing/auto-heal orchestration when related policy flags are enabled.
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                checkInAt:
                  type: string
                  format: date-time
                checkOutAt:
                  type: string
                  format: date-time
                breakMinutes:
                  type: integer
                isHoliday:
                  type: boolean
                notes:
                  type: string
                capture:
                  $ref: "#/components/schemas/AttendanceCaptureUpdate"
      responses:
        "200":
          description: Updated
  /attendance/records/{recordId}/approve:
    post:
      summary: Approve attendance record or correction
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
  /attendance/records/{recordId}/reject:
    post:
      summary: Reject attendance record or correction (optional reason)
      description: 'Optional JSON body `{"reason": string}` can be provided for audit/event trace.'
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Rejected
        "400":
          description: Invalid JSON body or invalid payload
  /attendance/auto-close:
    post:
      summary: Auto-close stale open attendance records (admin only)
      description: Finds records with missing check-out older than threshold and auto-closes with anomaly marker.
      responses:
        "200":
          description: Auto-close execution result
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin role required)
components:
  schemas:
    AttendanceCaptureChannel:
      type: string
      enum: [MANUAL, GPS, QR, WIFI, DEVICE]
    AttendanceCaptureCreate:
      type: object
      additionalProperties: false
      required:
        - channel
      properties:
        channel:
          $ref: "#/components/schemas/AttendanceCaptureChannel"
        deviceId:
          type: string
          minLength: 1
          maxLength: 120
        attestationToken:
          type: string
          minLength: 1
          maxLength: 256
        ipAddress:
          type: string
          format: ipv4
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: integer
          minimum: 0
          maximum: 10000
      description: GPS channel requires both latitude and longitude.
    AttendanceCaptureUpdate:
      type: object
      additionalProperties: false
      properties:
        channel:
          $ref: "#/components/schemas/AttendanceCaptureChannel"
        deviceId:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
        attestationToken:
          type: string
          minLength: 1
          maxLength: 256
        ipAddress:
          type:
            - string
            - "null"
        latitude:
          type:
            - number
            - "null"
          minimum: -90
          maximum: 90
        longitude:
          type:
            - number
            - "null"
          minimum: -180
          maximum: 180
        accuracyMeters:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 10000
      description: Coordinate fields must be provided as a pair (both numbers or both null).
