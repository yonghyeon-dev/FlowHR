owner: attendance-agent
version: 1.17.0
scope:
  in:
    - attendance record create/update
    - capture channel metadata (GPS/QR/WIFI/DEVICE/MANUAL) on attendance create/update
    - feature-flag based employee GPS capture enforcement
    - feature-flag based employee geofence enforcement
    - feature-flag based employee multi-site geofence enforcement
    - feature-flag based employee trusted device allowlist enforcement
    - feature-flag based employee device attestation enforcement
    - feature-flag based employee anti-spoofing signal-fusion and reputation risk enforcement
    - feature-flag based dynamic external reputation integration for anti-spoofing risk scoring
    - feature-flag based multi-provider external reputation orchestration (union/majority + minimum-success)
    - feature-flag based external reputation provider circuit-breaker (failure threshold/cooldown)
    - feature-flag based adaptive reputation provider routing and open-circuit auto-heal probing
    - attendance record list query by period
    - attendance aggregates query by period
    - correction approval/rejection flow
    - admin-triggered stale attendance auto-close (12h threshold, 9h default close)
    - rejection reason capture in audit/event payload
    - GPS payload validation (coordinate pair requirement)
    - approved/rejected attendance event publication
  out:
    - payroll tax and deduction
    - physical device protocol integration
    - geofence polygon policy engine
    - distributed anti-spoofing external reputation circuit-breaker state sharing
    - distributed adaptive routing and auto-heal state coordination across instances
    - trusted network policy engine
    - cryptographic device attestation policy engine
entities:
  - name: AttendanceRecord
    description: Employee time entry with check-in/check-out, state, and capture metadata.
  - name: AttendanceCorrection
    description: Requested or system-provided correction with approval state.
api:
  auth:
    - role: employee
      permission: create and list own attendance records
    - role: manager
      permission: approve/reject correction within assigned org
    - role: payroll_operator
      permission: list attendance records for payroll verification
    - role: admin
      permission: list attendance records without org restriction and run auto-close
  endpoints:
    - method: GET
      path: /attendance/records
      description: List attendance records filtered by period (from/to) and optional employeeId/state.
    - method: GET
      path: /attendance/aggregates
      description: List attendance aggregates (payable minutes totals) filtered by period (from/to) and optional employeeId.
    - method: POST
      path: /attendance/records
      description: Create attendance record with optional capture metadata payload.
    - method: PATCH
      path: /attendance/records/{recordId}
      description: Update attendance record before approval (including capture metadata).
    - method: POST
      path: /attendance/records/{recordId}/approve
      description: Approve attendance record or correction.
    - method: POST
      path: /attendance/records/{recordId}/reject
      description: Reject attendance record or correction with optional reason payload.
    - method: POST
      path: /attendance/auto-close
      description: Admin-triggered auto-close for stale open attendance records.
  events:
    published:
      - name: attendance.recorded.v1
        description: Emitted when attendance record is created.
      - name: attendance.approved.v1
        description: Emitted when attendance is approved and payable.
      - name: attendance.rejected.v1
        description: Emitted when attendance is rejected and excluded from payroll aggregation; includes optional reason.
      - name: attendance.corrected.v1
        description: Emitted when correction is approved.
    consumed:
      - name: employee.profile.updated.v1
        description: Employee metadata changed.
db_changes:
  migrations:
    - id: 202602130001_init_wi0001
      description: Create AttendanceRecord and PayrollRun base tables.
    - id: 202602130002_wi0001_api_extensions
      description: Extend AttendanceRecord with holiday/approval columns and add AuditLog.
    - id: 202602140006_employee_fk_constraints
      description: Backfill Employee rows and enforce employeeId FK constraints for core tables.
    - id: 202602160002_wi0048_attendance_capture_metadata
      description: Add attendance capture channel/device/ip/location metadata columns.
    - id: 202603050004_wi0925_attendance_auto_close
      description: Add AttendanceRecord anomalyType field for auto-closed stale records.
  backward_compatible: true
  notes: Expand-contract pattern for future attendance payload updates.
invariants:
  - An approved attendance record cannot be silently overwritten.
  - A rejected attendance record cannot transition directly to approved.
  - Rejected attendance record is excluded from payroll aggregation.
  - Attendance aggregate totals are derived from approved attendance records only.
  - Attendance timestamps are interpreted in Asia/Seoul.
  - Approved/rejected attendance emits exactly one final state event.
  - Auto-closed stale attendance sets anomalyType to AUTO_CLOSED and checkOutAt to checkInAt plus default work duration.
  - Employee attendance list queries are restricted to own employeeId.
  - AttendanceRecord.employeeId must reference existing Employee.id (FK enforced).
  - GPS capture channel requires both latitude and longitude.
  - Attendance location coordinates must be stored as a complete pair or omitted together.
  - When FLOWHR_ATTENDANCE_GPS_REQUIRED is enabled, employee attendance create/update must keep effective capture as GPS with coordinates.
  - When FLOWHR_ATTENDANCE_GEOFENCE_ENABLED is enabled, employee attendance GPS coordinates must be inside configured geofence radius.
  - When FLOWHR_ATTENDANCE_MULTI_SITE_GEOFENCE_ENABLED is enabled, employee attendance create/update GPS coordinates must match at least one configured site geofence.
  - When FLOWHR_ATTENDANCE_TRUSTED_DEVICE_ENABLED is enabled, employee attendance create/update must keep effective capture deviceId in trusted allowlist.
  - When FLOWHR_ATTENDANCE_DEVICE_ATTESTATION_ENABLED is enabled, employee attendance create/update must provide capture attestationToken that matches configured device mapping for effective deviceId.
  - When FLOWHR_ATTENDANCE_ANTI_SPOOFING_ENABLED is enabled, employee attendance create/update must keep effective capture risk score (base + signal-fusion + static/remote reputation penalties) at or below configured threshold.
  - When dynamic external reputation is enabled, remote provider snapshots must satisfy configured aggregation mode (union/majority) before risk penalty is applied.
  - When dynamic external reputation strict mode is enabled, provider minimum-success requirement breach must reject employee attendance writes.
  - When external reputation circuit-breaker is enabled, providers exceeding failure threshold must be skipped until cooldown expiry.
  - When external reputation adaptive routing is enabled, provider query order must prioritize healthy providers deterministically for identical provider-state snapshots.
  - When external reputation auto-heal is enabled, open-circuit providers may be probed at configured interval and must rejoin normal routing immediately after successful probe.
risk:
  permissions:
    - Unauthorized approval could alter payroll amount.
    - Unauthorized rejection could omit payable minutes.
  payroll_accuracy:
    - Incorrect overnight boundary handling can misclassify payable minutes.
    - Invalid capture metadata should not alter approval/payroll minute flow.
    - GPS policy false positives can block valid employee check-ins when flag is enabled.
    - Geofence configuration errors can block employee attendance writes when flag is enabled.
    - Multi-site geofence configuration errors can block employee attendance writes when flag is enabled.
    - Trusted device allowlist misconfiguration can block employee attendance writes when flag is enabled.
    - Device attestation token mapping errors can block employee attendance writes when flag is enabled.
    - Anti-spoofing threshold misconfiguration can block valid employee attendance writes when flag is enabled.
    - Anti-spoofing signal-fusion/reputation configuration errors can block valid employee attendance writes when flag is enabled.
    - External reputation provider failure in strict mode can block employee attendance writes when dynamic reputation flag is enabled.
    - Multi-provider reputation aggregation/threshold misconfiguration can over-block or under-block employee attendance writes.
    - Reputation circuit-breaker threshold/cooldown misconfiguration can over-skip healthy providers and block valid employee writes.
    - Adaptive routing or auto-heal probe misconfiguration can amplify latency or delay provider recovery.
  legal:
    - Attendance history must remain auditable.
test_plan:
  unit:
    - timestamp normalization by timezone
    - correction state transition validation
    - rejection reason schema boundary (max 500 chars)
    - attendance list query parsing and role boundary guards
    - attendance aggregates query parsing and role boundary guards
    - attendance aggregates totals are computed from approved records only
    - capture metadata validation (GPS requires coordinate pair)
    - gps policy flag truthy parsing and enforcement boundaries
    - geofence configuration parsing and distance threshold validation
    - multi-site geofence site-list parsing and match validation
    - trusted device allowlist parsing and effective deviceId validation
    - device attestation token mapping parsing and effective device/token validation
    - anti-spoofing risk-score (base + signal-fusion + reputation penalties) and threshold boundaries
    - external reputation provider response parsing and fallback/strict-mode boundaries
    - multi-provider reputation aggregation (union/majority) and minimum-success boundaries
    - circuit-breaker failure-threshold/cooldown boundaries
    - adaptive routing provider ordering and auto-heal probe interval boundaries
  integration:
    - create record rejects unknown employeeId (404)
    - create record to approve flow
    - create record to reject flow
    - reject flow with reason payload trace
    - reject flow invalid JSON body returns 400
    - reject flow oversized reason payload returns 400
    - list records by period returns expected rows
    - list aggregates by period returns expected totals and state counts
    - create attendance with capture metadata persists channel/device/ip/location
    - update pending attendance capture metadata persists new values
    - invalid capture metadata payload returns 400
    - employee manual/QR attendance write is rejected when gps policy flag is enabled
    - employee gps attendance write outside geofence is rejected when geofence flag is enabled
    - employee gps attendance write inside geofence is accepted when geofence flag is enabled
    - employee gps attendance write outside all configured geofences is rejected when multi-site geofence flag is enabled
    - employee gps attendance write inside one configured geofence is accepted when multi-site geofence flag is enabled
    - manager correction path remains allowed when gps policy flag is enabled
    - manager correction path remains allowed when geofence flag is enabled
    - manager correction path remains allowed when multi-site geofence flag is enabled
    - employee attendance write without trusted deviceId is rejected when trusted device flag is enabled
    - employee attendance write with untrusted deviceId is rejected when trusted device flag is enabled
    - employee attendance write with trusted deviceId is accepted when trusted device flag is enabled
    - employee attendance write without attestation token is rejected when device attestation flag is enabled
    - employee attendance write with mismatched attestation token is rejected when device attestation flag is enabled
    - employee attendance write with mapped attestation token is accepted when device attestation flag is enabled
    - employee attendance write with risk score above threshold is rejected when anti-spoofing flag is enabled
    - employee attendance write with risk score at or below threshold is accepted when anti-spoofing flag is enabled
    - employee attendance write with high-risk device/ip reputation is rejected when anti-spoofing signal-fusion is enabled
    - employee attendance write with insufficient trusted signal count is rejected when anti-spoofing signal-fusion is enabled
    - employee attendance write uses dynamic external reputation list when enabled
    - employee attendance write follows multi-provider aggregation mode (union/majority) when multiple reputation URLs are configured
    - employee attendance write strict mode rejects when provider minimum-success requirement is not met
    - employee attendance write with circuit-breaker enabled skips open providers during cooldown
    - employee attendance write with adaptive routing enabled prioritizes healthy providers over recently failed/open providers
    - employee attendance write with auto-heal enabled re-probes open providers after probe interval and restores recovered providers before cooldown expiry
    - manager correction path remains allowed when anti-spoofing flag is enabled
    - employee cross-employee list query is blocked with 403
    - manager list query requires employeeId (400)
    - admin auto-close closes only stale open attendance records
    - admin auto-close sets checkOutAt to checkInAt plus default work duration and anomalyType AUTO_CLOSED
    - employee role cannot call attendance auto-close endpoint (403)
  regression:
    - replay GC-001, GC-002, GC-003, GC-005
    - circuit-breaker disabled path preserves WI-0066 provider retry behavior
  authorization:
    - manager-only approval/rejection check
    - employee self-only list boundary check
  payroll_accuracy:
    - approved minutes match aggregation contract
observability:
  audit_events:
    - attendance.recorded
    - attendance.corrected
    - attendance.approved
    - attendance.rejected
    - attendance.auto_closed
  metrics:
    - attendance_approval_latency_ms
    - attendance_correction_count
    - attendance_rejection_count
    - attendance_capture_channel_count
    - attendance_gps_policy_reject_count
    - attendance_geofence_reject_count
    - attendance_multisite_geofence_reject_count
    - attendance_trusted_device_reject_count
    - attendance_device_attestation_reject_count
    - attendance_anti_spoofing_reject_count
    - attendance_anti_spoofing_signal_fusion_reject_count
    - attendance_anti_spoofing_external_reputation_reject_count
    - attendance_anti_spoofing_external_reputation_provider_success_count
    - attendance_anti_spoofing_external_reputation_provider_failure_count
    - attendance_anti_spoofing_external_reputation_circuit_open_count
    - attendance_anti_spoofing_external_reputation_circuit_skip_count
    - attendance_anti_spoofing_external_reputation_adaptive_route_count
    - attendance_anti_spoofing_external_reputation_auto_heal_probe_count
  logs:
    - authorization denied logs for attendance approval
    - capture metadata validation failure logs for attendance create/update
rollout:
  feature_flags:
    - name: attendance_v1
      default: "off"
    - name: FLOWHR_ATTENDANCE_GPS_REQUIRED
      default: "false"
    - name: FLOWHR_ATTENDANCE_GEOFENCE_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_MULTI_SITE_GEOFENCE_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_TRUSTED_DEVICE_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_DEVICE_ATTESTATION_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_ANTI_SPOOFING_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_ANTI_SPOOFING_SIGNAL_FUSION_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_ANTI_SPOOFING_EXTERNAL_REPUTATION_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_ANTI_SPOOFING_EXTERNAL_REPUTATION_ADAPTIVE_ROUTING_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_ANTI_SPOOFING_EXTERNAL_REPUTATION_AUTO_HEAL_ENABLED
      default: "false"
    - name: FLOWHR_ATTENDANCE_ANTI_SPOOFING_EXTERNAL_REPUTATION_AUTO_HEAL_PROBE_INTERVAL_SECONDS
      default: "60"
  migration_strategy: expand-contract
rollback:
  strategy: disable attendance_v1 and route reads to previous adapter
  max_recovery_time: 30m
deprecations: []
breaking_changes: false
consumer_impact: "Contract v1.17.0 adds admin-triggered attendance auto-close endpoint (`/attendance/auto-close`) and records AUTO_CLOSED anomalyType metadata on stale open attendance entries while preserving existing create/list/approve/reject behavior."
